name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "ledger/**", "src/lolpred/record.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:  # the ledger workflow redeploys after it commits

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # when called after a ledger commit, build that commit
      - name: Build the page
        run: |
          mkdir -p _site
          # site/index.html is written without the <html>/<head> wrapper (the claude.ai
          # preview adds its own). Add the wrapper and the mobile viewport tag here.
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            cat site/head-public.html
            cat site/index.html
            printf '\n</html>\n'
          } > _site/index.html
          cp site/data.json site/favicon.svg site/apple-touch-icon.png site/og.png _site/
          # The Worlds 2026 record, graded from the ledger (standard library only).
          python3 scripts/auto_ledger.py record --out _site/record.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
