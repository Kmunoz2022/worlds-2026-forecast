<meta charset="utf-8">
<title>Worlds 2026 Forecast</title>
<style>
/* Design tokens. Apple-style neutrals and one accent (system blue). Chart series
   colors (--s1..--s6, --seq) are the colorblind-validated palette and stay as they are. */
:root {
  --paper: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f2f2f7;
  --ink: #1d1d1f;
  --ink-2: #48484d;
  --muted: #6e6e73;
  --rule: #e5e5ea;
  --axis: #d1d1d6;
  --gold: #0071e3;            /* accent (name kept so page templates don't change) */
  --gold-soft: #e8f1fc;
  --seq: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --win: #248a3d;
  --loss: #d70015;
  --warn: #c93400;
  --ring: #ffffff;
  --side-blue: #2a78d6; --side-red: #d70015;
  --glass: rgba(245, 245, 247, 0.72);
  --glass-edge: rgba(0, 0, 0, 0.08);
  --fill: rgba(118, 118, 128, 0.12);       /* segmented-control track */
  --thumb: #ffffff;
  --thumb-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.05);
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --radius: 18px;
  --radius-s: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e;
    --ink: #f5f5f7; --ink-2: #c7c7cc; --muted: #98989d;
    --rule: #38383a; --axis: #48484a;
    --gold: #0a84ff; --gold-soft: #0b2a4a;
    --seq: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --win: #30d158; --loss: #ff453a; --warn: #ff9f0a; --ring: #1c1c1e; --side-blue: #3987e5; --side-red: #ff453a;
    --glass: rgba(22, 22, 23, 0.72); --glass-edge: rgba(255, 255, 255, 0.08);
    --fill: rgba(118, 118, 128, 0.24); --thumb: #636366;
    --thumb-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    --card-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e;
  --ink: #f5f5f7; --ink-2: #c7c7cc; --muted: #98989d;
  --rule: #38383a; --axis: #48484a;
  --gold: #0a84ff; --gold-soft: #0b2a4a;
  --seq: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --win: #30d158; --loss: #ff453a; --warn: #ff9f0a; --ring: #1c1c1e; --side-blue: #3987e5; --side-red: #ff453a;
  --glass: rgba(22, 22, 23, 0.72); --glass-edge: rgba(255, 255, 255, 0.08);
  --fill: rgba(118, 118, 128, 0.24); --thumb: #636366;
  --thumb-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
  --card-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
}

/* Typography: system font; tracking tightens as size grows, leading loosens as it shrinks.
   Sizes in rem so the page follows the reader's text-size setting. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--body); letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 70rem; margin: 0 auto; padding-inline: max(1rem, 3vw); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h2 { font-size: clamp(1.75rem, 1.4rem + 1.4vw, 2.5rem); font-weight: 700; line-height: 1.08; letter-spacing: -0.025em; }
h3 { font-size: 1.1875rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.016em; }
p { margin: 0; max-width: 68ch; }
a { color: var(--gold); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }

/* Top bar: a translucent material that content scrolls under. No hard divider:
   a soft edge appears only once content is actually underneath it. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 1px 0 transparent; transition: box-shadow .25s ease; }
.top.scrolled { box-shadow: 0 1px 0 var(--glass-edge), 0 8px 24px -16px rgba(0, 0, 0, 0.25); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.5rem; padding-block: 0.625rem; }
.brand { display: grid; gap: 0.0625rem; min-width: 0; }
.brand h1 { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.016em; white-space: nowrap; }
.brand h1 b { color: var(--gold); font-weight: 600; }
.brand .meta { font-size: 0.75rem; color: var(--muted); letter-spacing: 0; }

/* Segmented control. The white thumb slides between tabs on a spring (see script). */
nav { margin-left: auto; max-width: 100%; overflow-x: auto; scrollbar-width: none; border-radius: 9px; }
nav::-webkit-scrollbar { display: none; }
.seg-track { position: relative; display: inline-flex; gap: 0; padding: 2px; background: var(--fill); border-radius: 9px; }
.seg-thumb { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 7px; background: var(--thumb);
  box-shadow: var(--thumb-shadow); will-change: transform, width; pointer-events: none; }
nav a { position: relative; z-index: 1; font: 500 0.8125rem/1 var(--body); letter-spacing: -0.006em; text-decoration: none;
  color: var(--ink-2); padding: 0.4375rem 0.875rem; border-radius: 7px; white-space: nowrap;
  transition: color .2s ease, transform .2s ease; -webkit-tap-highlight-color: transparent; }
nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
nav a:active { transform: scale(0.96); transition-duration: 60ms; }
:is(nav a, button, select, tr, summary, .pt):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (max-width: 760px) { nav { margin-left: 0; width: 100%; } .seg-track { min-width: max-content; } }

main { padding-block: 2rem 4rem; }
#app { touch-action: pan-y; will-change: transform; }
section.page { display: grid; gap: 1.75rem; }
.lede { display: grid; gap: 0.5rem; }
.lede p { color: var(--ink-2); font-size: 1.0625rem; line-height: 1.47; }

/* Cards: rounded surfaces lifted by a soft shadow instead of a border. */
.panel { background: var(--surface); border: 0; border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 1.25rem 1.375rem;
  display: grid; gap: 0.875rem; min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.375rem 1rem; }
.note { font-size: 0.8125rem; line-height: 1.45; color: var(--muted); max-width: 80ch; }

/* region chip */
.chip { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.75rem; font-weight: 500; letter-spacing: 0; color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--rc); }
.team { display: inline-flex; flex-direction: column; gap: 1px; min-width: 0; align-items: flex-start; }
.team .nm { font-weight: 600; letter-spacing: -0.01em; }

/* Images: team logos, champion icons, player photos. Riot assets (fan-project use). */
.team-row { display: inline-flex; align-items: center; gap: 0.625rem; min-width: 0; text-align: left; }
.logo { width: 1.75rem; height: 1.75rem; object-fit: contain; flex: none; }
.logo-s { width: 1.125rem; height: 1.125rem; vertical-align: -0.2em; }
.logo-l { width: 2.75rem; height: 2.75rem; }
.logo.alt { display: none; }
/* Some logos are white: swap to the team's dark logo (or a dark silhouette) on the light theme. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .logo.has-alt { display: none; }
  :root:not([data-theme="dark"]) .logo.alt { display: inline-block; }
  :root:not([data-theme="dark"]) .logo.ink { filter: brightness(0); }
}
:root[data-theme="light"] .logo.has-alt { display: none; }
:root[data-theme="light"] .logo.alt { display: inline-block; }
:root[data-theme="light"] .logo.ink { filter: brightness(0); }
.champ { width: 1.75rem; height: 1.75rem; border-radius: 7px; object-fit: cover; flex: none; background: var(--fill); }
.champ-s { width: 1.25rem; height: 1.25rem; border-radius: 4px; }
.champ-l { width: 2.75rem; height: 2.75rem; border-radius: 10px; }
.ph { width: 2.75rem; height: 2.75rem; border-radius: 50%; object-fit: cover; object-position: 50% 15%; background: var(--fill); flex: none; }
.ph-s { width: 1.75rem; height: 1.75rem; }
.ph-empty { display: inline-grid; place-items: center; font: 600 0.75rem var(--body); color: var(--muted); }
.ent { display: inline-flex; align-items: center; gap: 0.5rem; min-width: 0; vertical-align: middle; }
.ent .sub { display: block; font: 400 0.75rem var(--body); color: var(--muted); letter-spacing: 0; }
.comp { display: inline-flex; gap: 2px; }

/* pick'em */
.picks { display: grid; grid-template-columns: 2fr 2fr 5fr; gap: 0.875rem; }
.pick-group { display: grid; gap: 0.5rem; align-content: start; }
.pick-group h3 { font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.pick-list { display: grid; gap: 0.5rem; }
.pick-group.adv .pick-list { grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); }
.pick { background: var(--surface); border: 0; border-radius: 14px; box-shadow: var(--card-shadow); padding: 0.75rem 0.875rem; display: grid; gap: 0.25rem; }
.panel .pick { background: var(--surface-2); box-shadow: none; }
.pick .p { font: 700 1.75rem/1.05 var(--display); letter-spacing: -0.022em; }
.pick .p small { font: 500 0.75rem var(--body); color: var(--muted); margin-left: 0.25rem; letter-spacing: 0; }
@media (max-width: 820px) { .picks { grid-template-columns: 1fr 1fr; } .pick-group.adv { grid-column: 1 / -1; } }

/* tables */
.tbl-wrap { overflow-x: auto; touch-action: pan-x pan-y; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 0.9375rem; }
th { font: 600 0.6875rem/1.2 var(--body); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); text-align: right; padding: 0.5rem; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: bottom; }
td { padding: 0.5rem 0.4375rem; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
td.l { white-space: normal; min-width: 8rem; }
th.grp { text-align: center; border-bottom: none; padding-bottom: 0; color: var(--ink-2); }
td.heat { background: color-mix(in oklab, var(--seq) var(--h), var(--surface)); min-width: 3.25rem; }
td.sep, th.sep { border-left: 1px solid var(--rule); }
.tag { font: 600 0.625rem/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 0.25rem 0.4375rem; margin-left: 0.375rem; vertical-align: 2px; }
.bar-cell { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
.bar-cell .track { display: block; width: 5.5rem; height: 6px; background: var(--fill); border-radius: 999px; overflow: hidden; flex: none; }
.bar-cell .fill { display: block; height: 100%; background: var(--s1); border-radius: 999px; }
tr.sel td { background: var(--gold-soft); }
tr.clickable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
tr.clickable:hover td { background: var(--surface-2); }
tr.clickable:active td { background: var(--fill); transition: none; }
.form { font-family: var(--body); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; text-align: left; }
.form .w { color: var(--win); } .form .l { color: var(--loss); }
.dots { display: inline-flex; gap: 2px; vertical-align: middle; }
.dots i { width: 0.4375rem; height: 0.4375rem; border-radius: 50%; background: var(--loss); }
#team-rows .logo { width: 1.5rem; height: 1.5rem; }
#team-rows td.l { min-width: 11rem; }
.dots i.w { background: var(--win); }

/* play-in */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(18.75rem, 100%), 1fr)); gap: 1rem; }
.match { display: grid; gap: 0.75rem; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem; }
.vs .side { display: grid; gap: 0.125rem; }
.vs .side:last-child { text-align: right; justify-items: end; }
.vs .big { font: 700 2.125rem/1 var(--display); letter-spacing: -0.025em; }
.vs .mid { font: 600 0.75rem var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.splitbar { display: flex; height: 8px; gap: 2px; }
.splitbar span { border-radius: 999px; }

/* bars chart (generic horizontal) */
.hbars { display: grid; gap: 0.375rem; }
.hbar { display: grid; grid-template-columns: minmax(6.875rem, 10rem) 1fr 4rem; gap: 0.625rem; align-items: center; font-size: 0.875rem; }
.hbar .track { height: 10px; border-radius: 0 999px 999px 0; position: relative; }
.hbar .fill { height: 100%; border-radius: 0 999px 999px 0; }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; }

/* matchup */
.controls { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; }
.field { display: grid; gap: 0.25rem; }
.field label { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
select { font: 500 0.9375rem var(--body); color: var(--ink); background: var(--surface-2); border: 0; border-radius: var(--radius-s); padding: 0.5625rem 0.75rem; min-width: 12rem; max-width: 100%; cursor: pointer; }
select:active { transform: scale(0.98); }
.seg { position: relative; display: inline-flex; padding: 2px; background: var(--fill); border-radius: 9px; }
.seg button { position: relative; z-index: 1; font: 500 0.875rem/1 var(--body); background: transparent; color: var(--ink-2); border: 0; padding: 0.5rem 1rem; border-radius: 7px; cursor: pointer; transition: transform .2s ease; -webkit-tap-highlight-color: transparent; }
.seg button[aria-pressed="true"] { background: var(--thumb); color: var(--ink); font-weight: 600; box-shadow: var(--thumb-shadow); }
.seg button:active { transform: scale(0.95); transition-duration: 60ms; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(10.5rem, 100%), 1fr)); gap: 0.75rem; }
.tile { background: var(--surface); box-shadow: var(--card-shadow); border-radius: 14px; padding: 0.875rem 1rem; display: grid; gap: 0.125rem; }
.panel .tile { background: var(--surface-2); box-shadow: none; }
.tile .k { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
.tile .v { font: 700 2rem/1.05 var(--display); letter-spacing: -0.025em; }
.tile .s { font-size: 0.8125rem; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 0.875rem; font-size: 0.8125rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
.legend i { width: 0.625rem; height: 0.625rem; border-radius: 50%; display: inline-block; }

/* charts */
svg text { fill: var(--muted); font: 0.75rem var(--body); font-variant-numeric: tabular-nums; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .base { stroke: var(--axis); stroke-width: 1; }
.chart { position: relative; touch-action: pan-y; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--glass); color: var(--ink); font-size: 0.8125rem; line-height: 1.35;
  padding: 0.5rem 0.625rem; border-radius: var(--radius-s); max-width: 15rem; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18), 0 0 0 0.5px var(--glass-edge);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.layout-teams { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 900px) { .layout-teams { grid-template-columns: 1fr; } }

/* tracker status (icon + label, never color alone) */
.status { display: inline-flex; align-items: center; gap: 0.375rem; font: 600 0.75rem/1 var(--body); padding: 0.3125rem 0.5625rem; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.status::before { content: var(--icon); font-weight: 700; color: var(--sc); }
.st-won { --sc: var(--win); --icon: "\2713"; }
.st-on-track { --sc: var(--win); --icon: "\25B2"; }
.st-behind { --sc: var(--warn); --icon: "\25BC"; }
.st-lost { --sc: var(--loss); --icon: "\2715"; }
.st-waiting, .st-not-started, .st-tied { --sc: var(--muted); --icon: "\2022"; }
.track-now { display: grid; gap: 0.25rem; padding: 0.625rem 0.75rem; background: var(--surface-2); border-radius: var(--radius-s); font-size: 0.875rem; }
.track-now .lead { color: var(--ink-2); font-size: 0.8125rem; }

/* crystal ball cards */
.picks2 { display: grid; gap: 0; background: var(--surface-2); border-radius: var(--radius-s); overflow: hidden; }
.pick-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; padding: 0.75rem; }
.pick-row.has-pic { grid-template-columns: auto minmax(0, 1fr) auto; }
.pick-row .ans { display: grid; gap: 0.125rem; justify-items: start; }
.pick-row .ans .k { font: 600 0.6875rem var(--body); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.pick-row .ans .nm { font: 600 1.1875rem/1.2 var(--display); letter-spacing: -0.016em; }
.pick-row .ans .sub { display: inline-flex; align-items: center; gap: 0.3rem; font: 500 0.8125rem var(--body); color: var(--ink-2); letter-spacing: 0; }
.pick-row + .pick-row { box-shadow: inset 0 1px 0 var(--rule); }
.pick-row .who { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.pick-row .ans { min-width: 0; }
.pick-row .ans small { font: 400 0.75rem var(--body); color: var(--muted); letter-spacing: 0; }

.q-head { display: flex; align-items: center; gap: 0.75rem; }
.track-now .lead { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 1rem; }
.lead-i { display: inline-flex; align-items: center; gap: 0.375rem; }
.score-row { display: grid; grid-template-columns: 3.25rem 1fr; gap: 0.625rem; align-items: center; }
.score-row .who { font-size: 0.8125rem; font-weight: 600; }
.top3 { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface-2); border-radius: var(--radius-s); overflow: hidden; }
.top3 li { display: grid; grid-template-columns: 2.375rem 1fr auto; gap: 0.5rem; align-items: center; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
.top3 li + li { box-shadow: inset 0 1px 0 var(--rule); }
.top3 .rk { font: 600 0.75rem var(--body); color: var(--gold); }
.why { display: grid; gap: 0.25rem; }
.why .k { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.why p { color: var(--ink-2); font-size: 0.875rem; line-height: 1.5; }
details summary { cursor: pointer; font-size: 0.8125rem; font-weight: 500; color: var(--gold); list-style: none; display: inline-flex; align-items: center; gap: 0.375rem; -webkit-tap-highlight-color: transparent; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: ""; width: 0.4375rem; height: 0.4375rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(-45deg); transition: transform .25s ease; margin-right: 0.125rem; }
details[open] summary::before { transform: rotate(45deg); }
details summary:active { opacity: 0.6; }

/* today */
h3.sec { font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.slot { display: grid; gap: 0.75rem; }
.slot:empty { display: none; }
.score-big { display: flex; align-items: center; gap: 0.75rem; font: 600 1.375rem/1.1 var(--display); letter-spacing: -0.02em; color: var(--ink-2); }
.score-big b { font-size: 2.25rem; font-weight: 700; }
.score-big .lead { color: var(--ink); }
.score-big .dash { color: var(--muted); }
.score-words { font-weight: 500; }
.games { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface-2); border-radius: var(--radius-s); overflow: hidden; }
.games li { display: grid; grid-template-columns: 4.5rem 1fr auto; gap: 0.625rem; align-items: baseline; padding: 0.5rem 0.75rem; font-size: 0.9375rem; }
.games li + li { box-shadow: inset 0 1px 0 var(--rule); }
.games .gn { font-size: 0.8125rem; color: var(--muted); }
.games li { grid-template-columns: 4.5rem minmax(8rem, 1fr) auto auto; align-items: center; }
.g-comps { display: inline-flex; align-items: center; gap: 0.5rem; }
.comp { align-items: center; }

<script>
const REGION_VAR = { LCK: "--s1", LPL: "--s2", LEC: "--s3", LCS: "--s4", LCP: "--s5", CBLOL: "--s6" };
const PAGES = ["today", "pickem", "playin", "crystal", "matchup", "teams", "record", "about"];
let D = null;
const state = { a: "Gen.G", b: "Bilibili Gaming", bo: 5, team: "Gen.G" };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p, d = 0) => p == null ? "–" : (p * 100 < 0.5 && p > 0 && d === 0 ? "<1" : (p * 100).toFixed(d)) + "%";
const teamOf = n => D.teams.find(t => t.name === n);
const chip = r => `<span class="chip" style="--rc: var(${REGION_VAR[r] || "--muted"})">${esc(r)}</span>`;
/* ---------- images (config/team_assets.json via data.json) ---------- */
const AS = () => D.assets || { teams: {}, players: {}, ddragon: null };
let PLAYERS_LC = null;
// Player photo record by name, any case ("knight" or "Knight").
function playerAsset(n) {
  if (!PLAYERS_LC) PLAYERS_LC = Object.fromEntries(Object.entries(AS().players).map(([k, v]) => [k.toLowerCase(), v]));
  return PLAYERS_LC[String(n).toLowerCase()];
}
function logo(team, size = "") {
  const t = AS().teams[team];
  if (!t) return "";
  const cls = "logo" + (size ? " logo-" + size : "");
  return `<img class="${cls}${t.logo_light ? " has-alt" : ""}${t.logo_ink ? " ink" : ""}" src="${t.logo}" alt="" loading="lazy" decoding="async">`
    + (t.logo_light ? `<img class="${cls} alt" src="${t.logo_light}" alt="" loading="lazy" decoding="async">` : "");
}
// Champion names ("Wukong") or feed ids ("MonkeyKing") -> Data Dragon id.
const champId = n => (AS().ddragon && AS().ddragon.champions[n]) || String(n).replace(/[^A-Za-z]/g, "");
const champImg = (n, size = "") => AS().ddragon
  ? `<img class="champ${size ? " champ-" + size : ""}" src="${AS().ddragon.base}/champion/${champId(n)}.png" alt="" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">` : "";
const itemImg = id => id && AS().ddragon
  ? `<img class="item" src="${AS().ddragon.base}/item/${id}.png" alt="" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">` : `<span class="item empty"></span>`;
const playerImg = (n, size = "") => {
  const a = playerAsset(n), cls = "ph" + (size ? " ph-" + size : "");
  return a ? `<img class="${cls}" src="${a.photo}" alt="" loading="lazy" decoding="async">` : `<span class="${cls} ph-empty" aria-hidden="true">${esc(String(n)[0] || "?")}</span>`;
};
const teamTag = (n, label = n, size = "s") => `<span class="ent">${logo(n, size)}<span>${esc(label)}</span></span>`;
const teamCell = n => { const t = teamOf(n); return `<span class="team-row">${logo(n)}<span class="team"><span class="nm">${esc(n)}</span>${chip(t.region)}</span></span>`; };
const fmtDate = s => new Date(s + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

/* ---------- series maths (beta-binomial, same as src/lolpred/series.py) ---------- */
function lgamma(x) { // Lanczos
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
const lbeta = (a, b) => lgamma(a) + lgamma(b) - lgamma(a + b);
const comb = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
function scoreDist(p, bo, kappa = D.meta.kappa) {
  const w = (bo + 1) / 2, al = p * kappa, be = (1 - p) * kappa, out = [];
  for (let l = 0; l < w; l++) {
    const n = comb(w - 1 + l, l);
    out.push({ a: w, b: l, p: n * Math.exp(lbeta(al + w, be + l) - lbeta(al, be)) });
    out.push({ a: l, b: w, p: n * Math.exp(lbeta(al + l, be + w) - lbeta(al, be)) });
  }
  return out;
}
const seriesWin = (p, bo) => scoreDist(p, bo).filter(s => s.a > s.b).reduce((s, x) => s + x.p, 0);
const gameP = (a, b) => D.game_prob[a][b];

const statusChip = st => `<span class="status st-${st.replace(/ /g, "-")}">${st[0].toUpperCase() + st.slice(1)}</span>`;

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.hidden = false;
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.max(8, ev.clientY - tip.offsetHeight - 12);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ---------- pages ---------- */
function pagePickem() {
  const sim = D.sim, byName = Object.fromEntries(sim.map(r => [r.team, r]));
  const card = (n, key, label) => `<div class="pick">${teamCell(n)}<div class="p num">${pct(byName[n][key])}<small>${label}</small></div></div>`;
  const pk = D.pickem;
  const heat = v => `<td class="heat num" style="--h:${Math.round(Math.min(1, v / 0.5) * 85)}%">${pct(v)}</td>`;
  const rows = [...sim].sort((a, b) => b.champion - a.champion || b.qualify - a.qualify).map(r => `
    <tr>
      <td>${teamCell(r.team)}${r.play_in_win != null ? `<span class="tag" title="Must win the Play-In first; odds include that">Play-In</span>` : ""}</td>
      ${["3-0", "3-1", "3-2"].map(k => heat(r[k])).join("")}
      ${["2-3", "1-3", "0-3"].map((k, i) => heat(r[k]).replace('class="heat', i === 0 ? 'class="heat sep' : 'class="heat')).join("")}
      <td class="sep num">${pct(r.qualify)}</td><td class="num">${pct(r.semis)}</td><td class="num">${pct(r.final)}</td>
      <td><div class="bar-cell"><span class="num">${pct(r.champion, r.champion < 0.1 ? 1 : 0)}</span><span class="track"><span class="fill" style="width:${Math.max(r.champion / 0.45 * 100, r.champion > 0 ? 1.5 : 0)}%"></span></span></div></td>
    </tr>`).join("");
  return `
  <section class="page" id="pickem">
    <div class="lede"><h2>Swiss stage pick'em</h2>
      <p>Our submitted picks, locked on ${fmtDate(D.pickem_locked_at.slice(0, 10))}: the two teams most likely to go 3-0, the two most likely to go 0-3, and the five most likely to advance from the rest. The percentages below are the latest odds and update as results come in.</p></div>
    <div class="picks">
      <div class="pick-group"><h3>Go 3-0</h3><div class="pick-list">${pk["3-0"].map(n => card(n, "3-0", "chance of 3-0")).join("")}</div></div>
      <div class="pick-group"><h3>Go 0-3</h3><div class="pick-list">${pk["0-3"].map(n => card(n, "0-3", "chance of 0-3")).join("")}</div></div>
      <div class="pick-group adv"><h3>Advance</h3><div class="pick-list">${pk.advance.map(n => card(n, "qualify", "to advance")).join("")}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Every team's Swiss record and title odds</h3><span class="note">Share of simulations. Darker cells are more likely.</span></div>
      <div class="tbl-wrap"><table>
        <thead>
          <tr><th></th><th class="grp" colspan="3">Advance at</th><th class="grp sep" colspan="3">Out at</th><th class="sep"></th><th></th><th></th><th></th></tr>
          <tr><th>Team</th><th>3-0</th><th>3-1</th><th>3-2</th><th class="sep">2-3</th><th>1-3</th><th>0-3</th><th class="sep">Advance</th><th>Semis</th><th>Final</th><th>Champion</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="note">Play-In teams' odds include having to win the Play-In first. Swiss pools are built from the confirmed seeds following last year's pool structure; the official round-1 draw isn't out yet. The pick'em format is assumed to be Riot's usual 2 / 2 / 5 picks.</p>
    </div>
  </section>`;
}

function seriesBlock(a, b, bo) {
  const p = gameP(a, b), dist = scoreDist(p, bo), sw = seriesWin(p, bo);
  const max = Math.max(...dist.map(d => d.p));
  const order = [...dist].sort((x, y) => (y.a - y.b) - (x.a - x.b));
  return { p, sw, html: `
    <div class="sub-k">Chance to win the series (best of ${bo})</div>
    <div class="vs">
      <div class="side">${teamCell(a)}<span class="big num">${pct(sw)}</span></div>
      <div class="mid">vs</div>
      <div class="side">${teamCell(b)}<span class="big num">${pct(1 - sw)}</span></div>
    </div>
    <div class="splitbar" role="img" aria-label="${esc(a)} ${pct(sw)}, ${esc(b)} ${pct(1 - sw)}">
      <span style="width:${sw * 100}%;background:var(--s1)"></span><span style="width:${(1 - sw) * 100}%;background:var(--s2)"></span>
    </div>
    <div class="sub-k">Chance of each final score</div>
    <div class="hbars" aria-label="Final score chances">
      ${order.map(d => `<div class="hbar"><span class="ent">${logo(d.a > d.b ? a : b, "s")}<span>${esc(short(d.a > d.b ? a : b))} <b class="num">${Math.max(d.a, d.b)}-${Math.min(d.a, d.b)}</b></span></span>
        <span class="track"><span class="fill" style="display:block;width:${d.p / max * 100}%;background:var(${d.a > d.b ? "--s1" : "--s2"})"></span></span>
        <span class="v">${pct(d.p)}</span></div>`).join("")}
    </div>
    <p class="note">Chance to win a single game: ${esc(a)} ${pct(p)}, ${esc(b)} ${pct(1 - p)}.</p>` };
}

function playinBracket() {
  // Follow our pick in every match: openers, then winners' final, losers' round, losers' final, grand final.
  const [[a, b], [c, d]] = D.play_in.round1;
  const match = (x, y) => { const p = seriesWin(gameP(x, y), 5); return { x, y, p, w: p >= 0.5 ? x : y, l: p >= 0.5 ? y : x }; };
  const m1 = match(a, b), m2 = match(c, d);
  const ubf = match(m1.w, m2.w), lb1 = match(m1.l, m2.l);
  const lbf = match(ubf.l, lb1.w), gf = match(ubf.w, lbf.w);
  return [
    ["Opening matches", [m1, m2], "Winners go to the winners' final, losers to the elimination match."],
    ["Winners' final", [ubf], "Winner goes straight to the grand final."],
    ["Elimination match", [lb1], "Loser is out (4th)."],
    ["Losers' final", [lbf], "Winners' final loser vs elimination-match winner. Loser is out (3rd)."],
    ["Grand final", [gf], "Winner joins the Swiss stage."],
  ];
}
function bracketMatch(mt) {
  const row = (t, p) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;${t === mt.w ? "font-weight:600" : "color:var(--ink-2)"}">
    <span>${teamTag(t, t, "")}${t === mt.w ? '<span class="tag">Pick</span>' : ""}</span><span class="num">${pct(p)}</span></div>`;
  const fav = mt.w, favIsX = fav === mt.x;
  const scores = scoreDist(gameP(mt.x, mt.y), 5).filter(d => favIsX ? d.a > d.b : d.b > d.a)
    .map(d => ({ s: `${Math.max(d.a, d.b)}-${Math.min(d.a, d.b)}`, p: d.p })).sort((u, v) => u.s.localeCompare(v.s));
  return `<div class="pick" style="gap:0"><span class="note">Chance to win the series</span>${row(mt.x, mt.p)}<div style="border-top:1px solid var(--rule)"></div>${row(mt.y, 1 - mt.p)}
    <span class="note" style="padding-top:6px">Most likely ways ${esc(fav)} wins: ${scores.map(x => `${x.s} ${pct(x.p)}`).join(" · ")}</span></div>`;
}

function pagePlayin() {
  const sim = Object.fromEntries(D.sim.map(r => [r.team, r]));
  const teams = [...D.play_in.teams].sort((x, y) => sim[y].play_in_win - sim[x].play_in_win);
  const max = Math.max(...teams.map(t => sim[t].play_in_win));
  const br = playinBracket();
  return `
  <section class="page" id="playin">
    <div class="lede"><h2>Play-In</h2>
      <p>Four teams, double elimination, every match best of five. The winners' bracket winner meets the losers' bracket winner in a grand final, and only the winner joins the Swiss stage.</p></div>
    <div class="panel">
      <div class="panel-head"><h3>Predicted bracket</h3><span class="note">Our pick in every match, and each team's chance to win that series</span></div>
      <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        ${br.map(([title, ms, note]) => `<div style="display:grid;gap:8px;align-content:start">
          <h3 style="font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)">${title}</h3>
          ${ms.map(bracketMatch).join("")}<span class="note">${note}</span></div>`).join("")}
      </div>
      <p class="note">Each later match assumes our earlier picks came true. If an upset happens, the Matchup tab gives the odds for whoever actually meets.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Chance to win the Play-In</h3><span class="note">Over every possible path through the bracket</span></div>
      <div class="hbars">${teams.map(t => `<div class="hbar">${teamCell(t)}
        <span class="track"><span class="fill" style="display:block;width:${sim[t].play_in_win / max * 100}%;background:var(--s1)"></span></span>
        <span class="v">${pct(sim[t].play_in_win)}</span></div>`).join("")}</div>
    </div>
    <h3>Opening matches in detail</h3>
    <div class="grid-2">${D.play_in.round1.map(([a, b]) => `<div class="panel match">${seriesBlock(a, b, 5).html}</div>`).join("")}</div>
  </section>`;
}

function pageCrystal() {
  const cb = D.crystal_ball, T = D.crystal_tracker;
  const groups = [
    ["Champions", ["presence", "champ_wr", "champ_deaths", "teemo", "unique"]],
    ["Players", ["kda", "dmg", "kp", "peyz_guma", "faker_700", "mvp_role"]],
    ["Games", ["len32", "kills15", "cs450", "shortest"]],
    ["Teams", ["regions_ko", "lcs_ko", "hle_t1"]],
  ];
  const byId = Object.fromEntries(cb.questions.map(q => [q.id, q]));
  const trkModel = id => T && T.model && T.model[id];
  const strength = p => p >= 0.75 ? "Strong pick" : p >= 0.55 ? "Lean" : p >= 0.3 ? "Best guess" : "Long shot";
  // What each answer is, so it can show its picture: champion icon, player photo or team logo.
  const CHAMP_Q = new Set(["presence", "champ_wr", "champ_deaths"]), PLAYER_Q = new Set(["kda", "dmg", "kp", "peyz_guma"]);
  const TEAM_Q = new Set(["shortest", "hle_t1"]);
  const QICON = { teemo: () => champImg("Teemo", "l"), faker_700: () => playerImg("Faker"), mvp_role: () => "" };
  // "Knight (Bilibili Gaming, Mid)" -> name, team, role
  const parsePlayer = label => { const m = String(label).match(/^(.*?) \((.*), (\w+)\)$/); return m ? { name: m[1], team: m[2], role: m[3] } : { name: String(label) }; };
  // Small version for lists: icon + name (+ team logo for players).
  const entity = (qid, label) => {
    if (CHAMP_Q.has(qid)) return `<span class="ent">${champImg(label, "s")}<span>${esc(label)}</span></span>`;
    if (PLAYER_Q.has(qid)) {
      const pl = parsePlayer(label), a = playerAsset(pl.name), team = pl.team || (a && a.team);
      return `<span class="ent">${playerImg(pl.name, "s")}<span>${esc(pl.name)}</span>${team ? logo(team, "s") : ""}</span>`;
    }
    if (TEAM_Q.has(qid) && AS().teams[label]) return teamTag(label);
    return esc(label);
  };
  // The pick itself: picture, name, team/role, then how sure the model was.
  const pickParts = (qid, label) => {
    if (CHAMP_Q.has(qid)) return { pic: champImg(label, "l"), name: label };
    if (PLAYER_Q.has(qid)) {
      const pl = parsePlayer(label), a = playerAsset(pl.name), team = pl.team || (a && a.team), role = pl.role || (a && a.role);
      return { pic: playerImg(pl.name), name: pl.name, sub: [team ? `${logo(team, "s")} ${esc(team)}` : "", role ? esc(role) : ""].filter(Boolean).join(" · ") };
    }
    if (TEAM_Q.has(qid) && AS().teams[label]) return { pic: logo(label, "l"), name: label };
    return { pic: "", name: label };
  };
  const pickRow = (pick, t, sub, qid) => {
    const x = pickParts(qid, pick);
    return `<div class="pick-row${x.pic ? " has-pic" : ""}">
      ${x.pic ? `<span class="pick-pic">${x.pic}</span>` : ""}
      <span class="ans"><span class="k">Model's pick</span><span class="nm">${esc(x.name)}</span>${x.sub ? `<span class="sub">${x.sub}</span>` : ""}<small>${sub}</small></span>
      ${t ? statusChip(t.status) : ""}
    </div>`;
  };
  const now = id => {
    const t = trkModel(id);
    if (!t || !T.started) return "";
    const lead = t.leaders && t.leaders.length ? `<span class="lead">Top now: ${t.leaders.map((l, i) => `<span class="lead-i">${i + 1}. ${entity(id, l.name)} <b class="num">${esc(l.value)}</b>${l.games ? ` <span class="muted">(${l.games} games)</span>` : ""}</span>`).join("")}</span>` : "";
    return `<div class="track-now"><b>${esc(t.summary)}</b>${lead}</div>`;
  };
  const card = q => {
    const opts = q.options.slice(0, 6), max = Math.max(...opts.map(o => o.p));
    const top = q.options.length > 2 ? q.options.slice(0, 3) : [];
    return `<div class="panel">
      <div class="q-head">${QICON[q.id] ? QICON[q.id]() : ""}<h3 style="font-size:1.0625rem">${esc(q.question)}</h3></div>
      <div class="picks2">
        ${pickRow(q.pick, trkModel(q.id), `Model's chance ${pct(q.pick_p)} · ${strength(q.pick_p).toLowerCase()}`, q.id)}
      </div>
      ${now(q.id)}
      ${top.length ? `<ol class="top3">${top.map((o, i) => `<li><span class="rk">${["1st", "2nd", "3rd"][i]}</span><span>${entity(q.id, o.label)}</span><span class="num">${pct(o.p)}</span></li>`).join("")}</ol>` : ""}
      <div class="why"><span class="k">Why this pick</span><p>${esc(q.why || "")}</p></div>
      <details><summary>How it's calculated${q.options.length > 3 ? " · all options" : ""}</summary>
        <div class="hbars" style="margin-top:10px">${opts.map(o => `<div class="hbar"><span>${entity(q.id, o.label)}</span>
          <span class="track"><span class="fill" style="display:block;width:${o.p / max * 100}%;background:var(${o.label === q.pick ? "--s1" : "--axis"})"></span></span>
          <span class="v">${pct(o.p)}</span></div>`).join("")}</div>
        <p class="note" style="margin-top:10px">${esc(q.method)}</p>
      </details>
    </div>`;
  };
  const order = ["won", "on track", "tied", "behind", "lost", "waiting", "not started"];
  const tallyRow = (who, t) => `<div class="score-row"><span class="who">${who}</span>
      <span class="legend" style="gap:0.5rem">${order.filter(k => t && t[k]).map(k => `${statusChip(k)}<span class="num">${t[k]}</span>`).join("")}</span></div>`;
  const scoreboard = !T ? "" : `<div class="panel">
      <div class="panel-head"><h3>Tracker</h3><span class="note">${T.started ? `${T.games} Worlds games so far · ${T.source === "live feed" ? "updated after every game" : `official data through ${fmtDate(T.data_through)}`}` : "Starts with the first Worlds game"}</span></div>
      ${tallyRow("Picks", T.tally.model)}
      <p class="note">Picks were locked before Worlds and can't change; this only shows how each one is doing. "Won" and "lost" are final; "on track" and "behind" can still change.</p>
    </div>`;
  const ov = Object.entries(cb.roster_overrides || {}).map(([t, r]) => Object.entries(r).map(([pos, p]) => `${p} plays ${pos} for ${t}`).join(", ")).join("; ");
  return `
  <section class="page" id="crystal">
    <div class="lede"><h2>Crystal Ball</h2>
      <p>The model's picks for all ${cb.questions.length} questions, locked before Worlds and tracked as it's played. They come from ${cb.sims.toLocaleString()} simulated tournaments (about ${Math.round(cb.games_mean)} games each), using each team's recent games against Worlds-level opponents.${ov ? ` Roster change included: ${esc(ov)}.` : ""}</p></div>
    ${scoreboard}
    <p class="note">How sure the model was: a strong pick wins at least 75% of the time, a lean 55-75%, a best guess is the single most likely answer, and a long shot is under 30% even as the favourite. Champion questions depend on the Worlds patch, so they're long shots.</p>
    ${groups.map(([g, ids]) => `<h3>${g}</h3><div class="grid-2">${ids.filter(i => byId[i]).map(i => card(byId[i])).join("")}</div>`).join("")}
  </section>`;
}

function renderHistory() {
  const el = $("#hist"); if (!el) return;
  $("#hist-title").textContent = `${state.team}: rating in 2026`;
  const W = 520, H = 260, m = { l: 44, r: 14, t: 12, b: 26 };
  const all = D.teams.map(t => ({ name: t.name, pts: t.history.map(([d, v]) => [new Date(d + "T12:00:00").getTime(), v]) }));
  const xs = all.flatMap(s => s.pts.map(p => p[0])), ys = all.flatMap(s => s.pts.map(p => p[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.floor(Math.min(...ys) / 100) * 100, y1 = Math.ceil(Math.max(...ys) / 100) * 100;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const path = pts => pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const yt = []; for (let v = y0; v <= y1; v += 100) yt.push(v);
  const months = []; const d = new Date(x0); d.setDate(1); d.setMonth(d.getMonth() + 1);
  for (; d.getTime() <= x1; d.setMonth(d.getMonth() + 1)) months.push(d.getTime());
  const sel = all.find(s => s.name === state.team), last = sel.pts[sel.pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(state.team)} rating over 2026, ending at ${Math.round(last[1])}">
    ${yt.map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    <line class="base" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/>
    ${months.map(t => `<text x="${X(t)}" y="${H - 8}" text-anchor="middle">${new Date(t).toLocaleDateString("en-US", { month: "short" })}</text>`).join("")}
    ${all.filter(s => s !== sel).map(s => `<path d="${path(s.pts)}" fill="none" stroke="var(--axis)" stroke-width="1"/>`).join("")}
    <path d="${path(sel.pts)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="var(--s1)" stroke="var(--ring)" stroke-width="2"/>
    <text x="${X(last[0]) - 8}" y="${Y(last[1]) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${Math.round(last[1])}</text>
    <line id="xh" class="base" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/>
    <circle id="xd" r="4" fill="var(--s1)" stroke="var(--ring)" stroke-width="2" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/>
  </svg>`;
  const svg = $("svg", el), hit = $("#hit", el), xh = $("#xh", el), xd = $("#xd", el);
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * W;
    const t = x0 + (vx - m.l) / (W - m.l - m.r) * (x1 - x0);
    let best = sel.pts[0]; for (const p of sel.pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    xh.setAttribute("x1", X(best[0])); xh.setAttribute("x2", X(best[0])); xh.setAttribute("visibility", "visible");
    xd.setAttribute("cx", X(best[0])); xd.setAttribute("cy", Y(best[1])); xd.setAttribute("visibility", "visible");
    showTip(`<b>${esc(state.team)}</b><br>${new Date(best[0]).toLocaleDateString("en-US", { month: "short", day: "numeric" })}: ${Math.round(best[1])}`, ev);
  });
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); xd.setAttribute("visibility", "hidden"); hideTip(); });
}

function pageRecord() {

  return `

        <p class="note">"Stronger region" always picks the team whose region has the better international record. It's a tough baseline at Worlds, where region strength is the biggest signal. On all ${mr.cross_league[0].n.toLocaleString()} international games since 2023, our model is clearly ahead: ${pct(mr.cross_league[0].accuracy, 1)} vs ${pct(mr.cross_league.find(r => r.model === "Stronger region").accuracy, 1)}.</p>

      <div class="panel" style="max-width:640px">

        <div class="chart" id="calib"></div>
        <p class="note">When the favourite was given 60-65%, did it win about 60-65% of the time? Points on the line mean yes. Hover a point for the game count.</p>

          <td class="num">${r.minute ? pct(r.share_over_90) : "–"}</td><td class="num">${r.acc_over_90 != null ? pct(r.acc_over_90, 1) : "–"}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note">In-game test: ${ig[0].n.toLocaleString()} games from ${D.ingame.test}, using gold, experience, CS and kill differences at each minute mark, trained on ${D.ingame.train}. The live model built from this runs on the Today page during matches; its Worlds 2026 calls are graded above.</p>

function record2026() {
  const L = D.ledger;

  const s = L.summary;
  const row = e => `<tr>
    <td class="l">${esc(e.stage)}</td><td class="l">${teamTag(e.team_a, short(e.team_a))} <span class="muted">vs</span> ${teamTag(e.team_b, short(e.team_b))} <span class="muted">Bo${e.best_of}</span></td>
    <td class="l"><b>${teamTag(e.pick, short(e.pick))}</b> <span class="muted small bd">${Object.entries(e.score_dist).filter(([k]) => { const [x, y] = k.split("-").map(Number); return e.pick === e.team_a ? x > y : y > x; }).map(([k, v]) => `${e.pick === e.team_a ? k : k.split("-").reverse().join("-")} ${pct(v)}`).sort().join(" · ")}</span></td>

  return `<div class="panel">
    <div class="panel-head"><h3>Worlds 2026 record</h3><span class="note">Every prediction is saved before the match and graded after</span></div>
    ${s.series ? `<div class="tiles">
      <div class="tile"><span class="k">Series picked right</span><span class="v">${s.series_correct}/${s.series}</span></div>
      <div class="tile"><span class="k">Games picked right</span><span class="v">${pct(s.game_accuracy, 1)}</span><span class="s">${s.games} games</span></div>
      <div class="tile"><span class="k">Exact score</span><span class="v">${s.scores_exact}/${s.series}</span></div>
      <div class="tile"><span class="k">Game log loss</span><span class="v">${s.game_log_loss.toFixed(3)}</span><span class="s">coin flip 0.693</span></div>
    </div>` : `<p class="muted">No Worlds 2026 matches graded yet. ${open.length} predictions are logged and waiting.</p>`}

/* ---------- Today: live predictions in the browser ---------- */
// The LoL Esports feed allows requests from any website, so the visitor's browser
// reads it directly. This key is the public one lolesports.com itself sends from
// every visitor's browser; it isn't a secret.
const LIVE_KEY = "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z";
const LV = { api: "https://esports-api.lolesports.com/persisted/gw", feed: "https://feed.lolesports.com/livestats/v1" };
// Testing: ?match=<id>&at=<ISO time> replays a finished match as if it were live.
const params = new URLSearchParams(location.search);
const clockOffset = params.get("at") ? Date.parse(params.get("at")) - Date.now() : 0;
const clock = () => new Date(Date.now() + clockOffset);
// delay: how far back live requests look. The feed rejects windows ending less
// than 20 s ago, so start at 40 s and back off if this device's clock runs fast.
const LIVE = { states: [], ok: null, next: null, current: null, previous: null, timer: 0, mtimer: 0, polling: false, delay: 40000, last: {} };
const liveGames = {};

async function lget(url) {
  const r = await fetch(url, { headers: { "x-api-key": LIVE_KEY } });
  if (!r.ok) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const feedTs = d => new Date(Math.floor(d.getTime() / 10000) * 10000).toISOString().replace(/\.\d{3}Z$/, "Z");
// 10 s of frames starting at d. Asked for a time after a game ended, the feed
// returns the game's final frames instead, so frames far from d are rejected.
async function frameWindow(gid, d) {
  const r = await fetch(`${LV.feed}/window/${gid}?startingTime=${feedTs(d)}`, { headers: { "x-api-key": LIVE_KEY } });
  // "Too recent" (HTTP 400): this device's clock is probably running fast. Look further back next time.
  if (r.status === 400) { LIVE.delay = Math.min(LIVE.delay + 15000, 120000); return null; }
  const t = r.ok ? await r.text() : "";
  const w = t ? JSON.parse(t) : null;
  if (!w || !w.frames || !w.frames.length) return null;
  return Math.abs(new Date(w.frames[0].rfc460Timestamp) - d) <= 40000 ? w : null;
}
// The feed has no game clock: step back to before the first frame, then narrow to 10 s.
// The feed can go silent mid-game (a 12-minute gap in one LCS game), so only
// 18 minutes without frames counts as "before the game started".
async function findStart(gid, around) {
  const step = 180000;
  let t = around.getTime(), misses = 0;
  for (let i = 0; i < 40 && misses < 6; i++) {
    if (await frameWindow(gid, new Date(t - (misses + 1) * step))) { t -= (misses + 1) * step; misses = 0; }
    else misses++;
  }
  let lo = t - step, hi = t;
  while (hi - lo > 10000) {
    const mid = lo + (hi - lo) / 2;
    if (await frameWindow(gid, new Date(mid))) hi = mid; else lo = mid;
  }
  for (const x of [lo, hi]) {
    const w = await frameWindow(gid, new Date(x));
    if (w) return new Date(w.frames[0].rfc460Timestamp);
  }
  return new Date(hi);
}
// The feed names players ("TLAW Morgan"), not our teams: vote by player.
function teamFromPlayers(meta) {
  const votes = {};
  for (const p of meta) {
    const name = (p.summonerName.includes(" ") ? p.summonerName.slice(p.summonerName.indexOf(" ") + 1) : p.summonerName).toLowerCase();
    const t = D.live.players[name];
    if (t) votes[t] = (votes[t] || 0) + 1;
  }
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : null;
}
// Same model as src/lolpred/live.py: pre-game log-odds plus leads scaled by game time.
function livePBlue(pre, minute, gold, kills, cs) {
  const L = D.live, p = Math.min(Math.max(pre, 1e-4), 1 - 1e-4), t = Math.min(minute / 10, L.max_t);
  const g = gold / 1000, c = cs / 10;
  const x = [Math.log(p / (1 - p)), g, g * t, kills, kills * t, c, c * t];
  return 1 / (1 + Math.exp(-(L.intercept + x.reduce((s, v, i) => s + v * L.coef[i], 0))));
}
// Same as series_win_prob_live in src/lolpred/series.py.
function seriesLive(p, bo, aw, bw, pCur) {
  const w = (bo + 1) / 2, k = D.meta.kappa, al = p * k, be = (1 - p) * k;
  const rest = (a, b) => {
    if (a >= w) return 1;
    if (b >= w) return 0;
    const q = (al + a) / (al + be + a + b);
    return q * rest(a + 1, b) + (1 - q) * rest(a, b + 1);
  };
  return pCur == null ? rest(aw, bw) : pCur * rest(aw + 1, bw) + (1 - pCur) * rest(aw, bw + 1);
}
const TEAM_ALIAS = { hle: "Hanwha Life Esports", gen: "Gen.G", geng: "Gen.G", dk: "Dplus KIA", al: "Anyone's Legend", blg: "Bilibili Gaming",
  tes: "Top Esports", ig: "Invictus Gaming", g2: "G2 Esports", mkoi: "Movistar KOI", kc: "Karmine Corp", tl: "Team Liquid", tlaw: "Team Liquid",
  c9: "Cloud9", tsw: "Team Secret Whales", cfo: "CTBC Flying Oyster", mvk: "MVK Esports", los: "LØS", fur: "FURIA" };
const normName = s => String(s).toLowerCase().replace(/ø/g, "o").replace(/[^a-z0-9]/g, "");
function ourTeam(t) {
  const n = normName(t.name), c = normName(t.code || "");
  for (const x of D.teams) {
    const o = normName(x.name);
    if (o === n || n.includes(o) || (o.includes(n) && n.length > 3)) return x.name;
  }
  return TEAM_ALIAS[c] || TEAM_ALIAS[n] || null;
}

async function liveGameState(ev, game, now) {
  let w = null, at = null;
  for (let i = 0; i < 4 && !w; i++) {   // on "too recent", frameWindow raises LIVE.delay: retry at once
    const before = LIVE.delay;
    at = new Date(now.getTime() - LIVE.delay);
    w = await frameWindow(game.id, at);
    if (!w && LIVE.delay === before) break;
  }
  if (!w) {
    // One failed check (slow network, fast device clock) shouldn't blank the card:
    // keep the last good update for up to 2 minutes.
    const prev = LIVE.last[game.id];
    return prev && Date.now() - prev.at < 120000 ? { ...prev.s, stale: true } : null;
  }
  let G = liveGames[game.id];
  if (!G) {
    const m = w.gameMetadata;
    const blue = teamFromPlayers(m.blueTeamMetadata.participantMetadata), red = teamFromPlayers(m.redTeamMetadata.participantMetadata);
    if (!blue || !red || blue === red || !D.live.p_blue[blue]) return null;
    G = liveGames[game.id] = { blue, red, pPre: D.live.p_blue[blue][red], history: [], start: null };
  }
  const f = w.frames[w.frames.length - 1];
  if (!G.start) G.start = await findStart(game.id, new Date(f.rfc460Timestamp));
  const minute = Math.max(0, (new Date(f.rfc460Timestamp) - G.start) / 60000);
  if (!G.filled) { G.filled = true; backfill(G, game.id, minute); }
  const B = f.blueTeam, R = f.redTeam, cs = t => t.participants.reduce((s, p) => s + p.creepScore, 0);
  const gold = B.totalGold - R.totalGold, kills = B.totalKills - R.totalKills, csd = cs(B) - cs(R);
  const p = livePBlue(G.pPre, minute, gold, kills, csd);
  const last = G.history[G.history.length - 1];
  if (!last || minute - last[0] >= 0.25) G.history.push([minute, p]);
  const [ta, tb] = ev.match.teams;
  const aw = (ta.result || {}).gameWins || 0, bw = (tb.result || {}).gameWins || 0;
  const aIsBlue = ((game.teams || []).find(t => t.id === ta.id) || {}).side === "blue";
  const A = aIsBlue ? G.blue : G.red, Bt = aIsBlue ? G.red : G.blue, bo = ev.match.strategy.count;
  const inGame = f.gameState === "in_game";
  const players = await livePlayers(game.id, at, w.gameMetadata, f);
  const out = { gid: game.id, num: game.number, minute, state: f.gameState, blue: G.blue, red: G.red, p, pPre: G.pPre,
    gold, csd, B, R, history: G.history, league: ev.league.name, players,
    series: { A, B: Bt, aw, bw, bo, p: seriesLive(gameP(A, Bt), bo, aw, bw, inGame ? (aIsBlue ? p : 1 - p) : null) } };
  LIVE.last[game.id] = { s: out, at: Date.now() };
  return out;
}

// Each player's champion, level, K/D/A, CS, gold and whether they're dead, from the
// window frame; items come from the feed's details endpoint (one more request).
async function livePlayers(gid, at, meta, f) {
  let items = {};
  try {
    const r = await fetch(`${LV.feed}/details/${gid}?startingTime=${feedTs(at)}`, { headers: { "x-api-key": LIVE_KEY } });
    const t = r.ok ? await r.text() : "", d = t ? JSON.parse(t) : null;
    if (d && d.frames && d.frames.length) items = Object.fromEntries(d.frames[d.frames.length - 1].participants.map(p => [p.participantId, p.items]));
  } catch (e) { /* items are optional */ }
  const side = (tm, fr) => tm.participantMetadata.map(pm => {
    const p = fr.participants.find(x => x.participantId === pm.participantId) || {};
    const name = pm.summonerName.includes(" ") ? pm.summonerName.slice(pm.summonerName.indexOf(" ") + 1) : pm.summonerName;
    return { name, role: pm.role, champ: pm.championId, level: p.level || 1, k: p.kills || 0, d: p.deaths || 0, a: p.assists || 0,
      cs: p.creepScore || 0, gold: p.totalGold || 0, dead: p.currentHealth === 0 && f.gameState === "in_game", items: items[pm.participantId] };
  });
  return { blue: side(meta.blueTeamMetadata, f.blueTeam), red: side(meta.redTeamMetadata, f.redTeam) };
}

// Opened mid-game: fill in the earlier minutes once, in the background, so the
// chart shows the whole game rather than starting when the page was opened.
async function backfill(G, gid, upTo) {
  const pts = [];
  for (let m = 0.5; m < upTo - 0.5; m += 1) {
    const w = await frameWindow(gid, new Date(G.start.getTime() + m * 60000));
    if (!w) continue;
    const f = w.frames[w.frames.length - 1], B = f.blueTeam, R = f.redTeam;
    const cs = t => t.participants.reduce((s, p) => s + p.creepScore, 0);
    const mm = (new Date(f.rfc460Timestamp) - G.start) / 60000;
    pts.push([mm, livePBlue(G.pPre, mm, B.totalGold - R.totalGold, B.totalKills - R.totalKills, cs(B) - cs(R))]);
  }
  G.history = [...pts, ...G.history].sort((a, b) => a[0] - b[0]);
  renderLive();
}

async function pollLive() {
  if (LIVE.polling) return;
  LIVE.polling = true;
  try {
    const now = clock();
    let events = [];
    if (params.get("match")) {
      const d = await lget(`${LV.api}/getEventDetails?hl=en-US&id=${params.get("match")}`);
      events = d ? [d.data.event] : [];
    } else {
      const d = await lget(`${LV.api}/getLive?hl=en-US`);
      const slugs = (params.get("league") || "worlds").split(",");
      const live = ((d && d.data.schedule.events) || []).filter(e => e.type === "match" && slugs.includes(e.league.slug));
      events = (await Promise.all(live.map(e => lget(`${LV.api}/getEventDetails?hl=en-US&id=${e.match.id}`))))
        .filter(Boolean).map(x => x.data.event);
    }
    const states = [];
    for (const ev of events) for (const g of ev.match.games || []) {
      if (!params.get("match") && g.state !== "inProgress") continue;
      const s = await liveGameState(ev, g, now);
      if (s) states.push(s);
    }
    LIVE.states = states;
    LIVE.ok = true;
  } catch (e) {
    LIVE.ok = false;   // e.g. the claude.ai preview, which blocks requests to other sites
  }
  LIVE.polling = false;
  renderLive();
}

}

// Each finished game's winner isn't in the feed directly. Read each game's final
// frames, score which side was ahead at the end (inhibitors, towers, gold), then
// give each team its official number of game wins, so the totals always match.
const gameCache = {};       // game id -> final summary (finished games never change)
const SEASON_FROM = "2026-01-01";

async function finalFrames(gid, lowerBound) {
  // Asked for a time after a game ended, the feed returns its final frames.
  const at = new Date(Math.max(lowerBound.getTime(), clock().getTime() - 90000));
  const r = await fetch(`${LV.feed}/window/${gid}?startingTime=${feedTs(at)}`, { headers: { "x-api-key": LIVE_KEY } });
  if (!r.ok) return null;
  const t = await r.text(); const w = t ? JSON.parse(t) : null;
  return w && w.frames && w.frames.length && w.frames[w.frames.length - 1].gameState === "finished" ? w : null;
}
async function gameSummary(g) {
  if (gameCache[g.id]) return gameCache[g.id];
  try { const c = JSON.parse(localStorage.getItem("g3:" + g.id) || "null"); if (c) return (gameCache[g.id] = c); } catch (e) {}
  const w = await finalFrames(g.id, new Date(0));
  if (!w) return null;
  const m = w.gameMetadata, f = w.frames[w.frames.length - 1];
  const blue = teamFromPlayers(m.blueTeamMetadata.participantMetadata), red = teamFromPlayers(m.redTeamMetadata.participantMetadata);
  const end = new Date(f.rfc460Timestamp), start = await findStart(g.id, end);
  const B = f.blueTeam, R = f.redTeam;
  const s = { blue, red, blueId: m.blueTeamMetadata.esportsTeamId, minutes: (end - start) / 60000, kills: [B.totalKills, R.totalKills],
    champs: [m.blueTeamMetadata, m.redTeamMetadata].map(t => t.participantMetadata.map(p => p.championId)),
    edge: 3 * (B.inhibitors - R.inhibitors) + (B.towers - R.towers) + (B.totalGold - R.totalGold) / 3000 };
  gameCache[g.id] = s;
  try { localStorage.setItem("g3:" + g.id, JSON.stringify(s)); } catch (e) {}
  return s;
}
async function matchDetail(e) {
  const d = await lget(`${LV.api}/getEventDetails?hl=en-US&id=${e.match.id}`);
  const ev = d && d.data.event;
  if (!ev) return null;
  const [ta, tb] = ev.match.teams, A = ourTeam(ta), B = ourTeam(tb);
  const done = ev.match.games.filter(g => g.state === "completed");
  const sums = await Promise.all(done.map(gameSummary));
  const aw = (ta.result || {}).gameWins || 0, bw = (tb.result || {}).gameWins || 0;
  // Team A's edge in each finished game, then hand A its official number of wins.
  const games = done.map((g, i) => {
    // The event's side list can be swapped; the feed's own game metadata is right.
    const s = sums[i], aBlue = s && s.blueId ? s.blueId === ta.id : ((g.teams || []).find(t => t.id === ta.id) || {}).side === "blue";
    return { num: g.number, s, aEdge: s ? (aBlue ? s.edge : -s.edge) : 0 };
  });
  const order = [...games].sort((x, y) => y.aEdge - x.aEdge);
  order.forEach((g, i) => { g.winner = i < aw ? A : B; });
  return { id: e.match.id, start: new Date(e.startTime), state: e.state, block: e.blockName || "", bo: ev.match.strategy.count,
    A, B, aName: ta.name, bName: tb.name, aw, bw, games: games.sort((x, y) => x.num - y.num),
    inProgress: ev.match.games.some(g => g.state === "inProgress"),
    liveGid: (ev.match.games.find(g => g.state === "inProgress") || {}).id };
}

/* ---------- motion: springs (Apple's damping ratio + response) ---------- */
// A spring has no fixed duration. Every new target continues from the current
// value and velocity, so any animation can be interrupted and redirected.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
function makeSpring(value, onUpdate) {
  const s = { value, velocity: 0, target: value, raf: 0, response: 0.35, damping: 1, done: null, last: 0 };
  const step = now => {
    // A frame's timestamp can be slightly earlier than when the animation started:
    // never step backwards, and cap long gaps (tab in background) at ~4 frames.
    const dt = Math.max(0, Math.min(0.064, (now - s.last) / 1000));
    s.last = now;
    const k = (2 * Math.PI / s.response) ** 2, c = 4 * Math.PI * s.damping / s.response;
    const n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
    for (let i = 0; i < n; i++) {
      s.velocity += (-k * (s.value - s.target) - c * s.velocity) * h;
      s.value += s.velocity * h;
    }
    if (Math.abs(s.velocity) < 1 && Math.abs(s.value - s.target) < 0.3) {
      s.value = s.target; s.velocity = 0; s.raf = 0;
      onUpdate(s.value);
      const done = s.done; s.done = null; done && done();
      return;
    }
    onUpdate(s.value);
    s.raf = requestAnimationFrame(step);
  };
  s.to = (target, { response = 0.35, damping = 1, velocity, done } = {}) => {
    s.target = target; s.response = response; s.damping = damping; s.done = done || null;
    if (velocity !== undefined) s.velocity = velocity;
    if (reduceMotion.matches) { s.set(target); done && done(); return; }
    if (!s.raf) { s.last = performance.now(); s.raf = requestAnimationFrame(step); }
  };
  s.set = v => { cancelAnimationFrame(s.raf); s.raf = 0; s.value = s.target = v; s.velocity = 0; onUpdate(v); };
  return s;
}
// Where a flick would come to rest (Apple's projection, exponential decay).
const project = (velocity, rate = 0.995) => (velocity / 1000) * rate / (1 - rate);
// Progressive resistance past an edge instead of a hard stop.
const rubberband = (overshoot, dim, c = 0.55) => (overshoot * dim * c) / (dim + c * Math.abs(overshoot));

    fadeRange = app.clientWidth * 0.9;
    appX.set(enterFrom.offset);
    appX.to(0, { velocity: enterFrom.velocity, response: 0.35 });
    enterFrom = null;
  } else if (reduceMotion.matches) {
    app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: "ease-out" });
  } else {
    const dir = Math.sign(PAGES.indexOf(id) - PAGES.indexOf(prev));
    fadeRange = 48;
    appX.set(dir * 40);
    appX.to(0, { response: 0.4 });
  }
}

/* ---------- swipe between tabs (touch and pen) ---------- */
function initSwipe() {
  let g = null;
  const width = () => app.clientWidth || innerWidth;
  app.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" || !e.isPrimary) return;
    if (e.target.closest(".tbl-wrap, .chart, select, input, .seg, details")) return;
    g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, axis: null, hist: [] };
  });
  app.addEventListener("pointermove", e => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (!g.axis) {
      if (Math.hypot(dx, dy) < 10) return;          // small threshold before committing to a direction
      if (Math.abs(dx) < Math.abs(dy) * 1.2) { g = null; return; }  // vertical: native scrolling
      g.axis = "x";
      try { app.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone: track without capture */ }
      fadeRange = width() * 0.9;
      g.base = appX.value - dx;                      // grab the page where it is, even mid-animation
      appX.set(appX.value);
    }
    let off = g.base + dx;
    const i = PAGES.indexOf(current);
    if ((off > 0 && i === 0) || (off < 0 && i === PAGES.length - 1)) off = rubberband(off, width());
    appX.set(off);
    g.hist.push([e.timeStamp, e.clientX]);
    if (g.hist.length > 6) g.hist.shift();
  });
  const end = e => {
    if (!g || e.pointerId !== g.id) return;
    const s = g; g = null;
    if (s.axis !== "x") return;
    const [t0, x0] = s.hist[0] || [0, 0], [t1, x1] = s.hist[s.hist.length - 1] || [0, 0];
    const v = t1 > t0 ? (x1 - x0) / ((t1 - t0) / 1000) : 0;   // release velocity, px/s
    const w = width(), i = PAGES.indexOf(current);
    const landing = appX.value + project(v);
    const commit = Math.min(w / 2, 200);   // same flick works on a phone and a tablet
    const next = landing < -commit && i < PAGES.length - 1 ? i + 1 : landing > commit && i > 0 ? i - 1 : i;
    if (next === i) { appX.to(0, { velocity: v, response: 0.3, damping: 0.85 }); return; }  // flick carried momentum
    // The new page continues the motion from the opposite side, at the finger's speed.
    enterFrom = { offset: appX.value + (next > i ? w : -w), velocity: v };
    location.hash = PAGES[next];
  };
  app.addEventListener("pointerup", end);
  app.addEventListener("pointercancel", end);
}

/* ---------- scroll edge: a soft edge under the bar only when content is beneath it ---------- */
let edgeQueued = false;
addEventListener("scroll", () => {
  if (edgeQueued) return;
  edgeQueued = true;
  requestAnimationFrame(() => { $("#top").classList.toggle("scrolled", scrollY > 4); edgeQueued = false; });
}, { passive: true });

function bindMatchup() {
  $("#selA").addEventListener("change", e => { state.a = e.target.value; renderMatchup(); });
  $("#selB").addEventListener("change", e => { state.b = e.target.value; renderMatchup(); });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    state.bo = +b.dataset.bo;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderMatchup();
  }));
}
function bindTeams() {
  const pick = tr => {
    state.team = tr.dataset.team;
    document.querySelectorAll("#team-rows tr").forEach(r => r.classList.toggle("sel", r === tr));
    renderHistory();
  };
  document.querySelectorAll("#team-rows tr").forEach(tr => {
    tr.addEventListener("click", () => pick(tr));
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(tr); } });
  });
}

Promise.all([fetch("data.json").then(r => r.json()),
  fetch("record.json").then(r => r.ok ? r.json() : null).catch(() => null)]).then(([d, rec]) => {
  D = d;
  // record.json is graded from the ledger when the site deploys; data.json's copy is the fallback.
  if (rec) {
    D.ledger = rec.ledger; D.liveRecord = rec.live;
    // The feed tracker updates after every game; the official-data one wins once it has caught up.
    if (rec.crystal && rec.crystal.games > ((D.crystal_tracker && D.crystal_tracker.games) || 0)) D.crystal_tracker = rec.crystal;
  }
  $("#meta").textContent = `Data through ${fmtDate(D.meta.data_through)} · ${D.meta.sims.toLocaleString()} simulated tournaments`;
  window.addEventListener("hashchange", route);
  initSwipe();
  route();
}).catch(() => { $("#app").innerHTML = `<p class="loading">The forecast data didn't load. Refresh the page to try again.</p>`; });
</script>
