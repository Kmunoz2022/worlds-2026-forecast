}

<script>
const REGION_VAR = { LCK: "--s1", LPL: "--s2", LEC: "--s3", LCS: "--s4", LCP: "--s5", CBLOL: "--s6" };
const PAGES = ["today", "pickem", "playin", "crystal", "matchup", "teams", "record", "about"];
let D = null;
const state = { a: "Gen.G", b: "Bilibili Gaming", bo: 5, team: "Gen.G" };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p, d = 0) => p == null ? "–" : (p * 100 < 0.5 && p > 0 && d === 0 ? "<1" : (p * 100).toFixed(d)) + "%";
const teamOf = n => D.teams.find(t => t.name === n);
const chip = r => `<span class="chip" style="--rc: var(${REGION_VAR[r] || "--muted"})">${esc(r)}</span>`;
const teamCell = n => { const t = teamOf(n); return `<span class="team"><span class="nm">${esc(n)}</span>${chip(t.region)}</span>`; };
const fmtDate = s => new Date(s + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

/* ---------- series maths (beta-binomial, same as src/lolpred/series.py) ---------- */
function lgamma(x) { // Lanczos
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
const lbeta = (a, b) => lgamma(a) + lgamma(b) - lgamma(a + b);
const comb = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
function scoreDist(p, bo, kappa = D.meta.kappa) {
  const w = (bo + 1) / 2, al = p * kappa, be = (1 - p) * kappa, out = [];
  for (let l = 0; l < w; l++) {
    const n = comb(w - 1 + l, l);
    out.push({ a: w, b: l, p: n * Math.exp(lbeta(al + w, be + l) - lbeta(al, be)) });
    out.push({ a: l, b: w, p: n * Math.exp(lbeta(al + l, be + w) - lbeta(al, be)) });
  }
  return out;
}
const seriesWin = (p, bo) => scoreDist(p, bo).filter(s => s.a > s.b).reduce((s, x) => s + x.p, 0);
const gameP = (a, b) => D.game_prob[a][b];

const statusChip = st => `<span class="status st-${st.replace(/ /g, "-")}">${st[0].toUpperCase() + st.slice(1)}</span>`;

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.hidden = false;
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.max(8, ev.clientY - tip.offsetHeight - 12);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ---------- pages ---------- */
function pagePickem() {

  const card = (n, key, label) => `<div class="pick">${teamCell(n)}<div class="p num">${pct(byName[n][key])}<small>${label}</small></div></div>`;
  const pk = D.pickem;
  const heat = v => `<td class="heat num" style="--h:${Math.round(Math.min(1, v / 0.5) * 85)}%">${pct(v)}</td>`;
  const rows = [...sim].sort((a, b) => b.champion - a.champion || b.qualify - a.qualify).map(r => `
    <tr>
      <td>${teamCell(r.team)}${r.play_in_win != null ? `<span class="tag" title="Must win the Play-In first; odds include that">Play-In</span>` : ""}</td>

      ${["2-3", "1-3", "0-3"].map((k, i) => heat(r[k]).replace('class="heat', i === 0 ? 'class="heat sep' : 'class="heat')).join("")}
      <td class="sep num">${pct(r.qualify)}</td><td class="num">${pct(r.semis)}</td><td class="num">${pct(r.final)}</td>
      <td><div class="bar-cell"><span class="num">${pct(r.champion, r.champion < 0.1 ? 1 : 0)}</span><span class="track"><span class="fill" style="width:${Math.max(r.champion / 0.45 * 100, r.champion > 0 ? 1.5 : 0)}%"></span></span></div></td>
    </tr>`).join("");
  return `
  <section class="page" id="pickem">
    <div class="lede"><h2>Swiss stage pick'em</h2>
      <p>Our submitted picks, locked on ${fmtDate(D.pickem_locked_at.slice(0, 10))}: the two teams most likely to go 3-0, the two most likely to go 0-3, and the five most likely to advance from the rest. The percentages below are the latest odds and update as results come in.</p></div>
    <div class="picks">
      <div class="pick-group"><h3>Go 3-0</h3><div class="pick-list">${pk["3-0"].map(n => card(n, "3-0", "chance of 3-0")).join("")}</div></div>
      <div class="pick-group"><h3>Go 0-3</h3><div class="pick-list">${pk["0-3"].map(n => card(n, "0-3", "chance of 0-3")).join("")}</div></div>
      <div class="pick-group adv"><h3>Advance</h3><div class="pick-list">${pk.advance.map(n => card(n, "qualify", "to advance")).join("")}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Every team's Swiss record and title odds</h3><span class="note">Share of simulations. Darker cells are more likely.</span></div>
      <div class="tbl-wrap"><table>
        <thead>
          <tr><th></th><th class="grp" colspan="3">Advance at</th><th class="grp sep" colspan="3">Out at</th><th class="sep"></th><th></th><th></th><th></th></tr>
          <tr><th>Team</th><th>3-0</th><th>3-1</th><th>3-2</th><th class="sep">2-3</th><th>1-3</th><th>0-3</th><th class="sep">Advance</th><th>Semis</th><th>Final</th><th>Champion</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="note">Play-In teams' odds include having to win the Play-In first. Swiss pools are built from the confirmed seeds following last year's pool structure; the official round-1 draw isn't out yet. The pick'em format is assumed to be Riot's usual 2 / 2 / 5 picks.</p>
    </div>
  </section>`;
}

function seriesBlock(a, b, bo) {
  const p = gameP(a, b), dist = scoreDist(p, bo), sw = seriesWin(p, bo);
  const max = Math.max(...dist.map(d => d.p));
  const order = [...dist].sort((x, y) => (y.a - y.b) - (x.a - x.b));
  return { p, sw, html: `
    <div class="vs">
      <div class="side">${teamCell(a)}<span class="big num">${pct(sw)}</span></div>
      <div class="mid">Bo${bo}</div>
      <div class="side">${teamCell(b)}<span class="big num">${pct(1 - sw)}</span></div>
    </div>
    <div class="splitbar" role="img" aria-label="${esc(a)} ${pct(sw)}, ${esc(b)} ${pct(1 - sw)}">
      <span style="width:${sw * 100}%;background:var(--s1)"></span><span style="width:${(1 - sw) * 100}%;background:var(--s2)"></span>
    </div>
    <div class="hbars" aria-label="Final score chances">
      ${order.map(d => `<div class="hbar"><span>${d.a > d.b ? esc(a) : esc(b)} <b class="num">${Math.max(d.a, d.b)}-${Math.min(d.a, d.b)}</b></span>
        <span class="track"><span class="fill" style="display:block;width:${d.p / max * 100}%;background:var(${d.a > d.b ? "--s1" : "--s2"})"></span></span>
        <span class="v">${pct(d.p)}</span></div>`).join("")}
    </div>
    <p class="note">One game: ${esc(a)} ${pct(p)}.</p>` };
}

function playinBracket() {
  // Follow our pick in every match: openers, then winners' final, losers' round, losers' final, grand final.
  const [[a, b], [c, d]] = D.play_in.round1;
  const match = (x, y) => { const p = seriesWin(gameP(x, y), 5); return { x, y, p, w: p >= 0.5 ? x : y, l: p >= 0.5 ? y : x }; };
  const m1 = match(a, b), m2 = match(c, d);
  const ubf = match(m1.w, m2.w), lb1 = match(m1.l, m2.l);
  const lbf = match(ubf.l, lb1.w), gf = match(ubf.w, lbf.w);
  return [
    ["Opening matches", [m1, m2], "Winners go to the winners' final, losers to the elimination match."],
    ["Winners' final", [ubf], "Winner goes straight to the grand final."],
    ["Elimination match", [lb1], "Loser is out (4th)."],
    ["Losers' final", [lbf], "Winners' final loser vs elimination-match winner. Loser is out (3rd)."],
    ["Grand final", [gf], "Winner joins the Swiss stage."],
  ];
}
function bracketMatch(mt) {
  const row = (t, p) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;${t === mt.w ? "font-weight:600" : "color:var(--ink-2)"}">
    <span>${esc(t)}${t === mt.w ? '<span class="tag">Pick</span>' : ""}</span><span class="num">${pct(p)}</span></div>`;
  const fav = mt.w, favIsX = fav === mt.x;
  const scores = scoreDist(gameP(mt.x, mt.y), 5).filter(d => favIsX ? d.a > d.b : d.b > d.a)
    .map(d => ({ s: `${Math.max(d.a, d.b)}-${Math.min(d.a, d.b)}`, p: d.p })).sort((u, v) => u.s.localeCompare(v.s));
  return `<div class="pick" style="gap:0">${row(mt.x, mt.p)}<div style="border-top:1px solid var(--rule)"></div>${row(mt.y, 1 - mt.p)}
    <span class="note" style="padding-top:6px">${esc(fav)} wins ${scores.map(x => `${x.s} ${pct(x.p)}`).join(" · ")}</span></div>`;
}

function pagePlayin() {
  const sim = Object.fromEntries(D.sim.map(r => [r.team, r]));
  const teams = [...D.play_in.teams].sort((x, y) => sim[y].play_in_win - sim[x].play_in_win);
  const max = Math.max(...teams.map(t => sim[t].play_in_win));
  const br = playinBracket();
  return `
  <section class="page" id="playin">
    <div class="lede"><h2>Play-In</h2>
      <p>Four teams, double elimination, every match best of five. The winners' bracket winner meets the losers' bracket winner in a grand final, and only the winner joins the Swiss stage.</p></div>
    <div class="panel">
      <div class="panel-head"><h3>Predicted bracket</h3><span class="note">Our pick in every match, and each team's chance to win that series</span></div>
      <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        ${br.map(([title, ms, note]) => `<div style="display:grid;gap:8px;align-content:start">
          <h3 style="font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)">${title}</h3>
          ${ms.map(bracketMatch).join("")}<span class="note">${note}</span></div>`).join("")}
      </div>
      <p class="note">Each later match assumes our earlier picks came true. If an upset happens, the Matchup tab gives the odds for whoever actually meets.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Chance to win the Play-In</h3><span class="note">Over every possible path through the bracket</span></div>
      <div class="hbars">${teams.map(t => `<div class="hbar">${teamCell(t)}
        <span class="track"><span class="fill" style="display:block;width:${sim[t].play_in_win / max * 100}%;background:var(--s1)"></span></span>
        <span class="v">${pct(sim[t].play_in_win)}</span></div>`).join("")}</div>
    </div>
    <h3>Opening matches in detail</h3>
    <div class="grid-2">${D.play_in.round1.map(([a, b]) => `<div class="panel match">${seriesBlock(a, b, 5).html}</div>`).join("")}</div>
  </section>`;
}

function pageCrystal() {
  const cb = D.crystal_ball, T = D.crystal_tracker;
  const groups = [
    ["Champions", ["presence", "champ_wr", "champ_deaths", "teemo", "unique"]],
    ["Players", ["kda", "dmg", "kp", "peyz_guma", "faker_700", "mvp_role"]],
    ["Games", ["len32", "kills15", "cs450", "shortest"]],
    ["Teams", ["regions_ko", "lcs_ko", "hle_t1"]],
  ];
  const byId = Object.fromEntries(cb.questions.map(q => [q.id, q]));
  const trkModel = id => T && T.model && T.model[id];
  const strength = p => p >= 0.75 ? "Strong pick" : p >= 0.55 ? "Lean" : p >= 0.3 ? "Best guess" : "Long shot";
  const pickRow = (who, pick, t, sub) => `<div class="pick-row">
      <span class="who">${who}</span>
      <span class="ans">${esc(pick)}${sub ? ` <small>${sub}</small>` : ""}</span>
      ${t ? statusChip(t.status) : ""}
    </div>`;
  const now = id => {
    const t = trkModel(id);
    if (!t || !T.started) return "";
    const lead = t.leaders && t.leaders.length ? `<span class="lead">Top now: ${t.leaders.map((l, i) => `${i + 1}. ${esc(l.name)} ${esc(l.value)}${l.games ? ` (${l.games}g)` : ""}`).join(" · ")}</span>` : "";
    return `<div class="track-now"><b>${esc(t.summary)}</b>${lead}</div>`;
  };
  const card = q => {
    const opts = q.options.slice(0, 6), max = Math.max(...opts.map(o => o.p));
    const top = q.options.length > 2 ? q.options.slice(0, 3) : [];
    return `<div class="panel">
      <h3 style="font-size:1.0625rem">${esc(q.question)}</h3>
      <div class="picks2">
        ${pickRow("Pick", q.pick, trkModel(q.id), `${pct(q.pick_p)} · ${strength(q.pick_p).toLowerCase()}`)}
      </div>
      ${now(q.id)}
      ${top.length ? `<ol class="top3">${top.map((o, i) => `<li><span class="rk">${["1st", "2nd", "3rd"][i]}</span><span>${esc(o.label)}</span><span class="num">${pct(o.p)}</span></li>`).join("")}</ol>` : ""}
      <div class="why"><span class="k">Why this pick</span><p>${esc(q.why || "")}</p></div>
      <details><summary>How it's calculated${q.options.length > 3 ? " · all options" : ""}</summary>
        <div class="hbars" style="margin-top:10px">${opts.map(o => `<div class="hbar"><span>${esc(o.label)}</span>
          <span class="track"><span class="fill" style="display:block;width:${o.p / max * 100}%;background:var(${o.label === q.pick ? "--s1" : "--axis"})"></span></span>
          <span class="v">${pct(o.p)}</span></div>`).join("")}</div>
        <p class="note" style="margin-top:10px">${esc(q.method)}</p>
      </details>
    </div>`;
  };
  const order = ["won", "on track", "tied", "behind", "lost", "waiting", "not started"];
  const tallyRow = (who, t) => `<div class="score-row"><span class="who">${who}</span>
      <span class="legend" style="gap:0.5rem">${order.filter(k => t && t[k]).map(k => `${statusChip(k)}<span class="num">${t[k]}</span>`).join("")}</span></div>`;
  const scoreboard = !T ? "" : `<div class="panel">
      <div class="panel-head"><h3>Tracker</h3><span class="note">${T.started ? `${T.games} Worlds games so far` : "Starts when Worlds games reach the data"}</span></div>
      ${tallyRow("Picks", T.tally.model)}
      <p class="note">Picks were locked before Worlds and can't change; this only shows how each one is doing. "Won" and "lost" are final; "on track" and "behind" can still change.</p>
    </div>`;
  const ov = Object.entries(cb.roster_overrides || {}).map(([t, r]) => Object.entries(r).map(([pos, p]) => `${p} plays ${pos} for ${t}`).join(", ")).join("; ");
  return `
  <section class="page" id="crystal">
    <div class="lede"><h2>Crystal Ball</h2>
      <p>The model's picks for all ${cb.questions.length} questions, locked before Worlds and tracked as it's played. They come from ${cb.sims.toLocaleString()} simulated tournaments (about ${Math.round(cb.games_mean)} games each), using each team's recent games against Worlds-level opponents.${ov ? ` Roster change included: ${esc(ov)}.` : ""}</p></div>
    ${scoreboard}
    <p class="note">How sure the model was: a strong pick wins at least 75% of the time, a lean 55-75%, a best guess is the single most likely answer, and a long shot is under 30% even as the favourite. Champion questions depend on the Worlds patch, so they're long shots.</p>
    ${groups.map(([g, ids]) => `<h3>${g}</h3><div class="grid-2">${ids.filter(i => byId[i]).map(i => card(byId[i])).join("")}</div>`).join("")}
  </section>`;
}

function pageMatchup() {
  const names = D.teams.map(t => t.name).sort((x, y) => x.localeCompare(y));
  const opts = sel => names.map(n => `<option${n === sel ? " selected" : ""}>${esc(n)}</option>`).join("");
  return `
  <section class="page" id="matchup">
    <div class="lede"><h2>Matchup</h2><p>Pick any two Worlds teams and a format to see who's favoured and how likely each final score is.</p></div>
    <div class="panel">
      <div class="controls">
        <div class="field"><label for="selA">Team</label><select id="selA">${opts(state.a)}</select></div>
        <div class="field"><label for="selB">Opponent</label><select id="selB">${opts(state.b)}</select></div>
        <div class="field"><label>Format</label><div class="seg" role="group" aria-label="Format">
          ${[1, 3, 5].map(n => `<button type="button" data-bo="${n}" aria-pressed="${state.bo === n}">Bo${n}</button>`).join("")}</div></div>
      </div>
      <div id="mu-out" class="match"></div>
      <p class="note">Probabilities average both sides of the map, since side selection isn't known in advance. Within a series, a matchup's edge varies from series to series, so sweeps are more common than independent coin flips would give.</p>
    </div>
  </section>`;
}
function renderMatchup() {
  const out = $("#mu-out"); if (!out) return;
  if (state.a === state.b) { out.innerHTML = `<p class="muted">Pick two different teams.</p>`; return; }
  out.innerHTML = seriesBlock(state.a, state.b, state.bo).html;
}

    <tr class="clickable${t.name === state.team ? " sel" : ""}" data-team="${esc(t.name)}" tabindex="0">

  return `
  <section class="page" id="teams">

          <tbody id="team-rows">${rows}</tbody></table></div>

      <div style="display:grid;gap:16px">

          <div class="panel-head"><h3 id="hist-title"></h3><span class="legend"><span><i style="background:var(--s1)"></i>Selected</span><span><i style="background:var(--axis)"></i>Other Worlds teams</span></span></div>
          <div class="chart" id="hist"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Region strength</h3><span class="note">Rating points added to every team in the region</span></div>
          <div class="hbars" id="leagues"></div>
          <p class="note">International record since 2022 in brackets. LCP started in 2025 and replaced PCS, VCS and LJL as the Pacific league; LCO and LLA no longer exist.</p>

      </div>

  </section>`;
}
function renderLeagues() {
  const el = $("#leagues"); if (!el) return;
  const lg = D.leagues.filter(l => !["LLA", "LCO", "VCS", "PCS", "LJL"].includes(l.league));
  const lo = Math.min(0, ...lg.map(l => l.offset)), hi = Math.max(...lg.map(l => l.offset));
  el.innerHTML = lg.map(l => {
    const zero = (0 - lo) / (hi - lo) * 100, w = Math.abs(l.offset) / (hi - lo) * 100, left = l.offset >= 0 ? zero : zero - w;
    return `<div class="hbar"><span>${chip(l.league)} <span class="muted small num">(${l.intl_wins}-${l.intl_games - l.intl_wins})</span></span>
      <span class="track" style="background:linear-gradient(var(--axis),var(--axis)) ${zero}% 0/1px 100% no-repeat">
        <span class="fill" style="position:absolute;left:${left}%;width:${w}%;background:var(${REGION_VAR[l.league] || "--muted"});border-radius:${l.offset >= 0 ? "0 4px 4px 0" : "4px 0 0 4px"}"></span></span>
      <span class="v">${l.offset > 0 ? "+" : ""}${Math.round(l.offset)}</span></div>`;
  }).join("");
}
function renderHistory() {
  const el = $("#hist"); if (!el) return;
  $("#hist-title").textContent = `${state.team}: rating in 2026`;
  const W = 520, H = 260, m = { l: 44, r: 14, t: 12, b: 26 };
  const all = D.teams.map(t => ({ name: t.name, pts: t.history.map(([d, v]) => [new Date(d + "T12:00:00").getTime(), v]) }));
  const xs = all.flatMap(s => s.pts.map(p => p[0])), ys = all.flatMap(s => s.pts.map(p => p[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.floor(Math.min(...ys) / 100) * 100, y1 = Math.ceil(Math.max(...ys) / 100) * 100;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const path = pts => pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const yt = []; for (let v = y0; v <= y1; v += 100) yt.push(v);
  const months = []; const d = new Date(x0); d.setDate(1); d.setMonth(d.getMonth() + 1);
  for (; d.getTime() <= x1; d.setMonth(d.getMonth() + 1)) months.push(d.getTime());
  const sel = all.find(s => s.name === state.team), last = sel.pts[sel.pts.length - 1];

/* ---------- Today: live predictions in the browser ---------- */
// The LoL Esports feed allows requests from any website, so the visitor's browser
// reads it directly. This key is the public one lolesports.com itself sends from
// every visitor's browser; it isn't a secret.
const LIVE_KEY = "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z";
const LV = { api: "https://esports-api.lolesports.com/persisted/gw", feed: "https://feed.lolesports.com/livestats/v1" };
// Testing: ?match=<id>&at=<ISO time> replays a finished match as if it were live.
const params = new URLSearchParams(location.search);
const clockOffset = params.get("at") ? Date.parse(params.get("at")) - Date.now() : 0;
const clock = () => new Date(Date.now() + clockOffset);
// delay: how far back live requests look. The feed rejects windows ending less
// than 20 s ago, so start at 40 s and back off if this device's clock runs fast.
const LIVE = { states: [], ok: null, next: null, timer: 0, polling: false, delay: 40000, last: {} };
const liveGames = {};

async function lget(url) {
  const r = await fetch(url, { headers: { "x-api-key": LIVE_KEY } });
  if (!r.ok) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const feedTs = d => new Date(Math.floor(d.getTime() / 10000) * 10000).toISOString().replace(/\.\d{3}Z$/, "Z");
// 10 s of frames starting at d. Asked for a time after a game ended, the feed
// returns the game's final frames instead, so frames far from d are rejected.
async function frameWindow(gid, d) {
  const r = await fetch(`${LV.feed}/window/${gid}?startingTime=${feedTs(d)}`, { headers: { "x-api-key": LIVE_KEY } });
  // "Too recent" (HTTP 400): this device's clock is probably running fast. Look further back next time.
  if (r.status === 400) { LIVE.delay = Math.min(LIVE.delay + 15000, 120000); return null; }
  const t = r.ok ? await r.text() : "";
  const w = t ? JSON.parse(t) : null;
  if (!w || !w.frames || !w.frames.length) return null;
  return Math.abs(new Date(w.frames[0].rfc460Timestamp) - d) <= 40000 ? w : null;
}
// The feed has no game clock: step back to before the first frame, then narrow to 10 s.
// The feed can go silent mid-game (a 12-minute gap in one LCS game), so only
// 18 minutes without frames counts as "before the game started".
async function findStart(gid, around) {
  const step = 180000;
  let t = around.getTime(), misses = 0;
  for (let i = 0; i < 40 && misses < 6; i++) {
    if (await frameWindow(gid, new Date(t - (misses + 1) * step))) { t -= (misses + 1) * step; misses = 0; }
    else misses++;
  }
  let lo = t - step, hi = t;
  while (hi - lo > 10000) {
    const mid = lo + (hi - lo) / 2;
    if (await frameWindow(gid, new Date(mid))) hi = mid; else lo = mid;
  }
  for (const x of [lo, hi]) {
    const w = await frameWindow(gid, new Date(x));
    if (w) return new Date(w.frames[0].rfc460Timestamp);
  }
  return new Date(hi);
}
// The feed names players ("TLAW Morgan"), not our teams: vote by player.
function teamFromPlayers(meta) {
  const votes = {};
  for (const p of meta) {
    const name = (p.summonerName.includes(" ") ? p.summonerName.slice(p.summonerName.indexOf(" ") + 1) : p.summonerName).toLowerCase();
    const t = D.live.players[name];
    if (t) votes[t] = (votes[t] || 0) + 1;
  }
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : null;
}
// Same model as src/lolpred/live.py: pre-game log-odds plus leads scaled by game time.
function livePBlue(pre, minute, gold, kills, cs) {
  const L = D.live, p = Math.min(Math.max(pre, 1e-4), 1 - 1e-4), t = Math.min(minute / 10, L.max_t);
  const g = gold / 1000, c = cs / 10;
  const x = [Math.log(p / (1 - p)), g, g * t, kills, kills * t, c, c * t];
  return 1 / (1 + Math.exp(-(L.intercept + x.reduce((s, v, i) => s + v * L.coef[i], 0))));
}
// Same as series_win_prob_live in src/lolpred/series.py.
function seriesLive(p, bo, aw, bw, pCur) {
  const w = (bo + 1) / 2, k = D.meta.kappa, al = p * k, be = (1 - p) * k;
  const rest = (a, b) => {
    if (a >= w) return 1;
    if (b >= w) return 0;
    const q = (al + a) / (al + be + a + b);
    return q * rest(a + 1, b) + (1 - q) * rest(a, b + 1);
  };
  return pCur == null ? rest(aw, bw) : pCur * rest(aw + 1, bw) + (1 - pCur) * rest(aw, bw + 1);
}
const TEAM_ALIAS = { hle: "Hanwha Life Esports", gen: "Gen.G", geng: "Gen.G", dk: "Dplus KIA", al: "Anyone's Legend", blg: "Bilibili Gaming",
  tes: "Top Esports", ig: "Invictus Gaming", g2: "G2 Esports", mkoi: "Movistar KOI", kc: "Karmine Corp", tl: "Team Liquid", tlaw: "Team Liquid",
  c9: "Cloud9", tsw: "Team Secret Whales", cfo: "CTBC Flying Oyster", mvk: "MVK Esports", los: "LØS", fur: "FURIA" };
const normName = s => String(s).toLowerCase().replace(/ø/g, "o").replace(/[^a-z0-9]/g, "");
function ourTeam(t) {
  const n = normName(t.name), c = normName(t.code || "");
  for (const x of D.teams) {
    const o = normName(x.name);
    if (o === n || n.includes(o) || (o.includes(n) && n.length > 3)) return x.name;
  }
  return TEAM_ALIAS[c] || TEAM_ALIAS[n] || null;
}

async function liveGameState(ev, game, now) {
  let w = null;
  for (let i = 0; i < 4 && !w; i++) {   // on "too recent", frameWindow raises LIVE.delay: retry at once
    const before = LIVE.delay;
    w = await frameWindow(game.id, new Date(now.getTime() - LIVE.delay));
    if (!w && LIVE.delay === before) break;
  }
  if (!w) {
    // One failed check (slow network, fast device clock) shouldn't blank the card:
    // keep the last good update for up to 2 minutes.
    const prev = LIVE.last[game.id];
    return prev && Date.now() - prev.at < 120000 ? { ...prev.s, stale: true } : null;
  }
  let G = liveGames[game.id];
  if (!G) {
    const m = w.gameMetadata;
    const blue = teamFromPlayers(m.blueTeamMetadata.participantMetadata), red = teamFromPlayers(m.redTeamMetadata.participantMetadata);
    if (!blue || !red || blue === red || !D.live.p_blue[blue]) return null;
    G = liveGames[game.id] = { blue, red, pPre: D.live.p_blue[blue][red], history: [], start: null };
  }
  const f = w.frames[w.frames.length - 1];
  if (!G.start) G.start = await findStart(game.id, new Date(f.rfc460Timestamp));
  const minute = Math.max(0, (new Date(f.rfc460Timestamp) - G.start) / 60000);
  if (!G.filled) { G.filled = true; backfill(G, game.id, minute); }
  const B = f.blueTeam, R = f.redTeam, cs = t => t.participants.reduce((s, p) => s + p.creepScore, 0);
  const gold = B.totalGold - R.totalGold, kills = B.totalKills - R.totalKills, csd = cs(B) - cs(R);
  const p = livePBlue(G.pPre, minute, gold, kills, csd);
  const last = G.history[G.history.length - 1];
  if (!last || minute - last[0] >= 0.25) G.history.push([minute, p]);
  const [ta, tb] = ev.match.teams;
  const aw = (ta.result || {}).gameWins || 0, bw = (tb.result || {}).gameWins || 0;
  const aIsBlue = ((game.teams || []).find(t => t.id === ta.id) || {}).side === "blue";
  const A = aIsBlue ? G.blue : G.red, Bt = aIsBlue ? G.red : G.blue, bo = ev.match.strategy.count;
  const inGame = f.gameState === "in_game";
  const out = { gid: game.id, num: game.number, minute, state: f.gameState, blue: G.blue, red: G.red, p, pPre: G.pPre,
    gold, csd, B, R, history: G.history, league: ev.league.name,
    series: { A, B: Bt, aw, bw, bo, p: seriesLive(gameP(A, Bt), bo, aw, bw, inGame ? (aIsBlue ? p : 1 - p) : null) } };
  LIVE.last[game.id] = { s: out, at: Date.now() };
  return out;
}

// Opened mid-game: fill in the earlier minutes once, in the background, so the
// chart shows the whole game rather than starting when the page was opened.
async function backfill(G, gid, upTo) {
  const pts = [];
  for (let m = 0.5; m < upTo - 0.5; m += 1) {
    const w = await frameWindow(gid, new Date(G.start.getTime() + m * 60000));
    if (!w) continue;
    const f = w.frames[w.frames.length - 1], B = f.blueTeam, R = f.redTeam;
    const cs = t => t.participants.reduce((s, p) => s + p.creepScore, 0);
    const mm = (new Date(f.rfc460Timestamp) - G.start) / 60000;
    pts.push([mm, livePBlue(G.pPre, mm, B.totalGold - R.totalGold, B.totalKills - R.totalKills, cs(B) - cs(R))]);
  }
  G.history = [...pts, ...G.history].sort((a, b) => a[0] - b[0]);
  renderLive();
}

async function pollLive() {
  if (LIVE.polling) return;
  LIVE.polling = true;
  try {
    const now = clock();
    let events = [];
    if (params.get("match")) {
      const d = await lget(`${LV.api}/getEventDetails?hl=en-US&id=${params.get("match")}`);
      events = d ? [d.data.event] : [];
    } else {
      const d = await lget(`${LV.api}/getLive?hl=en-US`);
      const slugs = (params.get("league") || "worlds").split(",");
      const live = ((d && d.data.schedule.events) || []).filter(e => e.type === "match" && slugs.includes(e.league.slug));
      events = (await Promise.all(live.map(e => lget(`${LV.api}/getEventDetails?hl=en-US&id=${e.match.id}`))))
        .filter(Boolean).map(x => x.data.event);
    }
    const states = [];
    for (const ev of events) for (const g of ev.match.games || []) {
      if (!params.get("match") && g.state !== "inProgress") continue;
      const s = await liveGameState(ev, g, now);
      if (s) states.push(s);
    }
    LIVE.states = states;
    LIVE.ok = true;
  } catch (e) {
    LIVE.ok = false;   // e.g. the claude.ai preview, which blocks requests to other sites
  }
  LIVE.polling = false;
  renderLive();
}

async function loadNext() {
  try {
    const d = await lget(`${LV.api}/getSchedule?hl=en-US&leagueId=${D.live.worlds_league_id}`);
    LIVE.next = ((d && d.data.schedule.events) || [])
      .filter(e => e.type === "match" && e.state !== "completed")
      .sort((a, b) => a.startTime.localeCompare(b.startTime)).slice(0, 4);
  } catch (e) {
    LIVE.next = null;
  }
  renderNext();
}

function liveChart(h, width) {
  // Drawn at the card's real width so labels stay at their normal size.
  const W = Math.max(280, Math.round(width)), H = 160, m = { l: 40, r: 10, t: 10, b: 22 };
  const xmax = Math.max(30, ...h.map(p => p[0]));
  const X = v => m.l + v / xmax * (W - m.l - m.r), Y = v => H - m.b - v * (H - m.t - m.b);
  const path = h.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const last = h[h.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" role="img" aria-label="Blue side win chance over the game">
    ${[0, .5, 1].map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
    ${[0, 10, 20, 30, 40].filter(v => v <= xmax).map(v => `<text x="${X(v)}" y="${H - 5}" text-anchor="middle">${v}'</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--side-blue)" stroke-width="2" stroke-linejoin="round"/>
    ${last ? `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="var(--side-blue)" stroke="var(--ring)" stroke-width="2"/>` : ""}
  </svg>`;
}

function renderLive() {
  const el = $("#live-slot");
  if (!el) return;
  if (LIVE.ok === false) {
    el.innerHTML = `<div class="panel"><div class="panel-head"><h3>Live</h3>${statusChip("waiting")}</div>
      <p class="note">Live win chances need the public version of this site; this preview can't connect to the LoL Esports feed.</p></div>`;
    return;
  }
  if (LIVE.ok === null) { el.innerHTML = `<div class="panel"><p class="note">Checking for a live game…</p></div>`; return; }
  if (!LIVE.states.length) {
    el.innerHTML = `<div class="panel"><div class="panel-head"><h3>Live</h3><span class="note">Checks every 10 seconds</span></div>
      <p class="muted">No Worlds game is live right now. When one starts, its win chance appears here.</p></div>`;
    return;
  }
  el.innerHTML = LIVE.states.map(s => {
    const S = s.series, mm = Math.floor(s.minute), ss = String(Math.floor((s.minute - mm) * 60)).padStart(2, "0");
    return `<div class="panel live-card">
      <div class="panel-head"><h3><span class="live-dot" aria-hidden="true"></span>Live · Game ${s.num}</h3>
        <span class="note">${esc(s.league)} · ${mm}:${ss}${s.state !== "in_game" ? " · " + esc(s.state.replace("_", " ")) : ""}${s.stale ? " · updating…" : ""}</span></div>
      <div class="vs">
        <div class="side"><span class="team"><span class="nm">${esc(s.blue)}</span><span class="chip" style="--rc: var(--side-blue)">Blue side</span></span>
          <span class="big num" style="color:var(--side-blue)">${pct(s.p)}</span><span class="note">pre-game ${pct(s.pPre)}</span></div>
        <div class="mid">Win chance</div>
        <div class="side"><span class="team" style="align-items:flex-end"><span class="nm">${esc(s.red)}</span><span class="chip" style="--rc: var(--side-red)">Red side</span></span>
          <span class="big num" style="color:var(--side-red)">${pct(1 - s.p)}</span><span class="note">pre-game ${pct(1 - s.pPre)}</span></div>
      </div>
      <div class="splitbar"><span style="width:${s.p * 100}%;background:var(--side-blue)"></span><span style="width:${(1 - s.p) * 100}%;background:var(--side-red)"></span></div>
      ${liveChart(s.history, el.clientWidth - 44)}
      <div class="tiles">
        <div class="tile"><span class="k">Gold</span><span class="v" style="font-size:1.375rem">${s.gold > 0 ? "+" : ""}${s.gold.toLocaleString()}</span></div>
        <div class="tile"><span class="k">Kills</span><span class="v" style="font-size:1.375rem">${s.B.totalKills}–${s.R.totalKills}</span></div>
        <div class="tile"><span class="k">Towers</span><span class="v" style="font-size:1.375rem">${s.B.towers}–${s.R.towers}</span></div>
        <div class="tile"><span class="k">Dragons · Barons</span><span class="v" style="font-size:1.375rem">${s.B.dragons.length}–${s.R.dragons.length} · ${s.B.barons}–${s.R.barons}</span></div>
      </div>
      <p>Series (Bo${S.bo}): ${esc(S.A)} ${S.aw}–${S.bw} ${esc(S.B)} · chance to win the series: <b>${esc(S.A)} ${pct(S.p)}</b>, ${esc(S.B)} ${pct(1 - S.p)}</p>
      <p class="note">Win chance = pre-game prediction plus the gold, kill and CS leads. On 18,700 recent games, calls above 90% were right 95–97% of the time. About 40 seconds behind the broadcast.</p>
    </div>`;
  }).join("");
}

function renderNext() {
  const el = $("#next-slot");
  if (!el) return;
  if (!LIVE.next || !LIVE.next.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="panel"><div class="panel-head"><h3>Up next</h3><span class="note">From the official schedule</span></div>
    <div class="next-list">${LIVE.next.map((e, i) => {
      const [ta, tb] = e.match.teams, a = ourTeam(ta), b = ourTeam(tb), bo = e.match.strategy.count;
      const when = new Date(e.startTime);
      const known = a && b && a !== b;
      const pa = known ? seriesWin(gameP(a, b), bo) : null;
      return `<div class="next-row">
        <div class="when"><b>${when.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</b>
          <span class="note">${when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })} · ${esc(e.blockName || "")} · Bo${bo}</span>
          ${i === 0 ? `<span class="note countdown" data-t="${when.getTime()}"></span>` : ""}</div>
        <div class="who">${known
          ? `<span class="${pa >= 0.5 ? "fav" : ""}">${esc(a)} ${pct(pa)}</span><span class="note">vs</span><span class="${pa < 0.5 ? "fav" : ""}">${esc(b)} ${pct(1 - pa)}</span>`
          : `<span>${esc(ta.name || "TBD")}</span><span class="note">vs</span><span>${esc(tb.name || "TBD")}</span>`}</div>
      </div>`;
    }).join("")}</div></div>`;
  tickCountdown();
}
function tickCountdown() {
  document.querySelectorAll(".countdown").forEach(c => {
    const ms = +c.dataset.t - clock().getTime();
    if (ms <= 0) { c.textContent = "Starting now"; return; }
    const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
    c.textContent = `Starts in ${h ? `${h} h ` : ""}${m} min`;
  });
}

function pageToday() {
  const T = D.crystal_tracker;
  const tallyLine = t => ["won", "on track", "tied", "behind", "lost"].filter(k => t && t[k]).map(k => `${statusChip(k)}<span class="num">${t[k]}</span>`).join("") || `<span class="note">Starts with the first Worlds game</span>`;
  return `
  <section class="page" id="today">
    <div class="lede"><h2>Today</h2>
      <p>The game being played right now, what's next, and how our predictions are doing.</p></div>
    <div id="live-slot"></div>
    <div id="next-slot"></div>
    ${record2026()}
    <div class="grid-2">
      <a class="panel link-card" href="#crystal">
        <div class="panel-head"><h3>Crystal Ball</h3><span class="chev" aria-hidden="true"></span></div>
        <div class="score-row"><span class="who">Picks</span><span class="legend" style="gap:.5rem">${tallyLine(T && T.tally.model)}</span></div>
      </a>
      <a class="panel link-card" href="#pickem">
        <div class="panel-head"><h3>Pick'em</h3><span class="chev" aria-hidden="true"></span></div>
        <p class="note">3-0: ${D.pickem["3-0"].map(esc).join(", ")} · 0-3: ${D.pickem["0-3"].map(esc).join(", ")}</p>
        <p class="note">Advance: ${D.pickem.advance.map(esc).join(", ")}</p>
      </a>

function startToday() {
  stopToday();
  renderLive(); renderNext();
  pollLive(); loadNext();
  LIVE.timer = setInterval(() => { pollLive(); tickCountdown(); }, 10000);
}
function stopToday() { clearInterval(LIVE.timer); LIVE.timer = 0; }

/* ---------- motion: springs (Apple's damping ratio + response) ---------- */
// A spring has no fixed duration. Every new target continues from the current
// value and velocity, so any animation can be interrupted and redirected.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
function makeSpring(value, onUpdate) {
  const s = { value, velocity: 0, target: value, raf: 0, response: 0.35, damping: 1, done: null, last: 0 };
  const step = now => {
    // A frame's timestamp can be slightly earlier than when the animation started:
    // never step backwards, and cap long gaps (tab in background) at ~4 frames.
    const dt = Math.max(0, Math.min(0.064, (now - s.last) / 1000));
    s.last = now;
    const k = (2 * Math.PI / s.response) ** 2, c = 4 * Math.PI * s.damping / s.response;
    const n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
    for (let i = 0; i < n; i++) {
      s.velocity += (-k * (s.value - s.target) - c * s.velocity) * h;
      s.value += s.velocity * h;
    }
    if (Math.abs(s.velocity) < 1 && Math.abs(s.value - s.target) < 0.3) {
      s.value = s.target; s.velocity = 0; s.raf = 0;
      onUpdate(s.value);
      const done = s.done; s.done = null; done && done();
      return;
    }
    onUpdate(s.value);
    s.raf = requestAnimationFrame(step);
  };
  s.to = (target, { response = 0.35, damping = 1, velocity, done } = {}) => {
    s.target = target; s.response = response; s.damping = damping; s.done = done || null;
    if (velocity !== undefined) s.velocity = velocity;
    if (reduceMotion.matches) { s.set(target); done && done(); return; }
    if (!s.raf) { s.last = performance.now(); s.raf = requestAnimationFrame(step); }
  };
  s.set = v => { cancelAnimationFrame(s.raf); s.raf = 0; s.value = s.target = v; s.velocity = 0; onUpdate(v); };
  return s;
}
// Where a flick would come to rest (Apple's projection, exponential decay).
const project = (velocity, rate = 0.995) => (velocity / 1000) * rate / (1 - rate);
// Progressive resistance past an edge instead of a hard stop.
const rubberband = (overshoot, dim, c = 0.55) => (overshoot * dim * c) / (dim + c * Math.abs(overshoot));

/* ---------- segmented control thumb ---------- */
const thumb = $("#thumb");
const thumbX = makeSpring(0, v => { thumb.style.transform = `translateX(${v}px)`; });
const thumbW = makeSpring(0, v => { thumb.style.width = `${v}px`; });
let thumbPlaced = false;
function moveThumb(animate = true) {
  const a = $("#tabs a[aria-current='page']");
  if (!a) return;
  if (!animate || !thumbPlaced) { thumbX.set(a.offsetLeft); thumbW.set(a.offsetWidth); thumbPlaced = true; }
  else { thumbX.to(a.offsetLeft); thumbW.to(a.offsetWidth); }
  const nav = $("#tabs"), l = a.offsetLeft, r = l + a.offsetWidth;
  if (l < nav.scrollLeft || r > nav.scrollLeft + nav.clientWidth)
    nav.scrollTo({ left: l - 24, behavior: reduceMotion.matches ? "auto" : "smooth" });
}
addEventListener("resize", () => moveThumb(false));

/* ---------- page motion ---------- */
const app = $("#app");
let fadeRange = 1;
const appX = makeSpring(0, v => {
  app.style.transform = v ? `translateX(${v}px)` : "";
  app.style.opacity = v ? String(Math.max(0, 1 - Math.abs(v) / fadeRange)) : "";
});
let current = null, enterFrom = null;

/* ---------- router ---------- */
const RENDER = { today: pageToday, pickem: pagePickem, playin: pagePlayin, crystal: pageCrystal, matchup: pageMatchup, teams: pageTeams, record: pageRecord, about: pageAbout };
function route() {
  let id = location.hash.slice(1);
  if (!PAGES.includes(id)) id = "today";
  const prev = current;
  current = id;
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + id ? "page" : "false"));
  moveThumb(prev !== null);
  app.innerHTML = RENDER[id]();
  hideTip();
  if (id === "matchup") { renderMatchup(); bindMatchup(); }
  if (id === "teams") { renderHistory(); renderLeagues(); bindTeams(); }
  if (id === "record") renderCalib();
  if (id === "today") startToday(); else stopToday();
  if (prev === null || prev === id) return;
  if (scrollY > $("#top").offsetHeight) scrollTo({ top: 0 });
  // Enter from the side we're moving toward: forward comes in from the right.
  if (enterFrom) {
    fadeRange = app.clientWidth * 0.9;
    appX.set(enterFrom.offset);
    appX.to(0, { velocity: enterFrom.velocity, response: 0.35 });
    enterFrom = null;
  } else if (reduceMotion.matches) {
    app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: "ease-out" });
  } else {
    const dir = Math.sign(PAGES.indexOf(id) - PAGES.indexOf(prev));
    fadeRange = 48;
    appX.set(dir * 40);
    appX.to(0, { response: 0.4 });
  }
}

/* ---------- swipe between tabs (touch and pen) ---------- */
function initSwipe() {
  let g = null;
  const width = () => app.clientWidth || innerWidth;
  app.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" || !e.isPrimary) return;
    if (e.target.closest(".tbl-wrap, .chart, select, input, .seg, details")) return;
    g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, axis: null, hist: [] };
  });
  app.addEventListener("pointermove", e => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (!g.axis) {
      if (Math.hypot(dx, dy) < 10) return;          // small threshold before committing to a direction
      if (Math.abs(dx) < Math.abs(dy) * 1.2) { g = null; return; }  // vertical: native scrolling
      g.axis = "x";
      try { app.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone: track without capture */ }
      fadeRange = width() * 0.9;
      g.base = appX.value - dx;                      // grab the page where it is, even mid-animation
      appX.set(appX.value);
    }
    let off = g.base + dx;
    const i = PAGES.indexOf(current);
    if ((off > 0 && i === 0) || (off < 0 && i === PAGES.length - 1)) off = rubberband(off, width());
    appX.set(off);
    g.hist.push([e.timeStamp, e.clientX]);
    if (g.hist.length > 6) g.hist.shift();
  });
  const end = e => {
    if (!g || e.pointerId !== g.id) return;
    const s = g; g = null;
    if (s.axis !== "x") return;
    const [t0, x0] = s.hist[0] || [0, 0], [t1, x1] = s.hist[s.hist.length - 1] || [0, 0];
    const v = t1 > t0 ? (x1 - x0) / ((t1 - t0) / 1000) : 0;   // release velocity, px/s
    const w = width(), i = PAGES.indexOf(current);
    const landing = appX.value + project(v);
    const commit = Math.min(w / 2, 200);   // same flick works on a phone and a tablet
    const next = landing < -commit && i < PAGES.length - 1 ? i + 1 : landing > commit && i > 0 ? i - 1 : i;
    if (next === i) { appX.to(0, { velocity: v, response: 0.3, damping: 0.85 }); return; }  // flick carried momentum
    // The new page continues the motion from the opposite side, at the finger's speed.
    enterFrom = { offset: appX.value + (next > i ? w : -w), velocity: v };
    location.hash = PAGES[next];
  };
  app.addEventListener("pointerup", end);
  app.addEventListener("pointercancel", end);
}

/* ---------- scroll edge: a soft edge under the bar only when content is beneath it ---------- */
let edgeQueued = false;
addEventListener("scroll", () => {
  if (edgeQueued) return;
  edgeQueued = true;
  requestAnimationFrame(() => { $("#top").classList.toggle("scrolled", scrollY > 4); edgeQueued = false; });
}, { passive: true });

function bindMatchup() {
  $("#selA").addEventListener("change", e => { state.a = e.target.value; renderMatchup(); });
  $("#selB").addEventListener("change", e => { state.b = e.target.value; renderMatchup(); });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    state.bo = +b.dataset.bo;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderMatchup();
  }));
}
function bindTeams() {
  const pick = tr => {
    state.team = tr.dataset.team;
    document.querySelectorAll("#team-rows tr").forEach(r => r.classList.toggle("sel", r === tr));
    renderHistory();
  };
  document.querySelectorAll("#team-rows tr").forEach(tr => {
    tr.addEventListener("click", () => pick(tr));
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(tr); } });
  });
}

fetch("data.json").then(r => r.json()).then(d => {
  D = d;
  $("#meta").textContent = `Data through ${fmtDate(D.meta.data_through)} · ${D.meta.sims.toLocaleString()} simulated tournaments`;
  window.addEventListener("hashchange", route);
  initSwipe();
  route();
}).catch(() => { $("#app").innerHTML = `<p class="loading">The forecast data didn't load. Refresh the page to try again.</p>`; });
</script>
