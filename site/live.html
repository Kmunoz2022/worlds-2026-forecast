<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worlds Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f3f4f1; --surface: #ffffff; --surface-2: #f8f9f7; --ink: #15181d; --ink-2: #47505c; --muted: #7c8591;
  --rule: #e1e3df; --axis: #c3c6c0; --gold: #a8781f; --blue: #2a78d6; --red: #c03a3a;
  --display: "Saira Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --paper: #111317; --surface: #1b1e23; --surface-2: #20242a; --ink: #f2f3f1; --ink-2: #c3c8cf;
    --muted: #8b939e; --rule: #2c3038; --axis: #3b4049; --gold: #d9a441; --blue: #3987e5; --red: #ef6b6b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 18px; }
h1, h2 { font-family: var(--display); margin: 0; letter-spacing: .02em; }
h1 { font-size: 26px; text-transform: uppercase; } h1 b { color: var(--gold); }
.meta { color: var(--muted); font-size: 13px; }
.game { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; display: grid; gap: 14px; }
.head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.side { display: grid; gap: 2px; } .side.r { text-align: right; }
.side .n { font-weight: 600; } .side .p { font: 700 44px/1 var(--display); font-variant-numeric: tabular-nums; }
.blue .p { color: var(--blue); } .red .p { color: var(--red); }
.mid { font: 600 14px var(--display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; text-align: center; }
.bar { display: flex; height: 10px; gap: 2px; } .bar span { border-radius: 4px; transition: width .4s; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 5px; padding: 8px 10px; }
.stat .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.series { font-size: 14px; color: var(--ink-2); }
svg text { fill: var(--muted); font: 11px var(--body); }
.empty { color: var(--muted); padding: 30px 0; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div><h1>Worlds <b>Live</b></h1><div class="meta" id="meta">Waiting for data…</div></div>
  <div id="games"></div>
  <p class="meta">Win chance = pre-game prediction + gold, kill and CS leads (tested on 18,700 games: calls above 90% were right about 95% of the time). Data from the LoL Esports live feed, about 20 seconds behind the game.</p>
</div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = p => Math.round(p * 100) + "%";
const sign = v => (v > 0 ? "+" : "") + v.toLocaleString();
function chart(h) {
  const W = 600, H = 150, m = { l: 34, r: 8, t: 8, b: 20 };
  const xmax = Math.max(30, ...h.map(p => p[0]));
  const X = v => m.l + v / xmax * (W - m.l - m.r), Y = v => H - m.b - v * (H - m.t - m.b);
  const path = h.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const ticks = [0, 10, 20, 30, 40].filter(v => v <= xmax);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Blue side win chance over the game">
    ${[0, .5, 1].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${m.l - 4}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
    ${ticks.map(v => `<text x="${X(v)}" y="${H - 5}" text-anchor="middle">${v}'</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2"/>
    ${h.length ? `<circle cx="${X(h[h.length - 1][0])}" cy="${Y(h[h.length - 1][1])}" r="4" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>` : ""}
  </svg>`;
}
function render(d) {
  document.getElementById("meta").textContent = `Updated ${new Date(d.updated).toLocaleTimeString()} · ${d.games.length} live game${d.games.length === 1 ? "" : "s"}`;
  const el = document.getElementById("games");
  if (!d.games.length) { el.innerHTML = `<p class="empty">No Worlds game is live right now. This page updates by itself every few seconds.</p>`; return; }
  el.innerHTML = d.games.map(g => {
    const s = g.series, ob = g.objectives;
    return `<div class="game">
      <div class="head"><h2>${esc(g.blue)} vs ${esc(g.red)} · Game ${g.game_number}</h2><span class="meta">${esc(g.league)} · ${g.minute.toFixed(1)} min · patch ${esc((g.patch || "").split(".").slice(0, 2).join("."))}</span></div>
      <div class="vs">
        <div class="side blue"><span class="n">${esc(g.blue)} <span class="meta">blue</span></span><span class="p">${pct(g.p_blue)}</span><span class="meta">pre-game ${pct(g.p_pre_blue)}</span></div>
        <div class="mid">Win chance</div>
        <div class="side r red"><span class="n"><span class="meta">red</span> ${esc(g.red)}</span><span class="p">${pct(1 - g.p_blue)}</span><span class="meta">pre-game ${pct(1 - g.p_pre_blue)}</span></div>
      </div>
      <div class="bar"><span style="width:${g.p_blue * 100}%;background:var(--blue)"></span><span style="width:${(1 - g.p_blue) * 100}%;background:var(--red)"></span></div>
      ${chart(g.history)}
      <div class="stats">
        <div class="stat"><div class="k">Gold</div><div class="v">${sign(g.gold_diff)}</div></div>
        <div class="stat"><div class="k">Kills</div><div class="v">${ob.blue.totalKills}-${ob.red.totalKills}</div></div>
        <div class="stat"><div class="k">Towers</div><div class="v">${ob.blue.towers}-${ob.red.towers}</div></div>
        <div class="stat"><div class="k">Dragons</div><div class="v">${ob.blue.dragons.length}-${ob.red.dragons.length}</div></div>
        <div class="stat"><div class="k">Barons</div><div class="v">${ob.blue.barons}-${ob.red.barons}</div></div>
        <div class="stat"><div class="k">CS</div><div class="v">${sign(g.cs_diff)}</div></div>
      </div>
      <div class="series">Series (Bo${s.best_of}): ${esc(s.team_a)} ${s.a_wins}-${s.b_wins} ${esc(s.team_b)} · chance to win the series: <b>${esc(s.team_a)} ${pct(s.p_a)}</b>, ${esc(s.team_b)} ${pct(1 - s.p_a)}</div>
    </div>`;
  }).join("");
}
async function tick() {
  try { const r = await fetch("live/live.json?" + Date.now()); if (r.ok) render(await r.json()); } catch (e) {}
  setTimeout(tick, 5000);
}
tick();
</script>
</body>
</html>
